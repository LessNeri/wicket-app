services:
  - type: web
    name: wicket-captcha-app
    env: java
    buildCommand: mvn clean package
    startCommand: java $JAVA_OPTS -jar target/dependency/webapp-runner.jar target/wicket-app.war --port $PORT
    plan: free
    envVars:
      - key: JAVA_OPTS
        value: -Xmx256m -Xss512k -XX:+UseCompressedOops