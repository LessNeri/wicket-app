<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario</title>
    
    <style>
        /* PALETA MORADA (consistente con RegistrarUsuarioPage) */
        :root {
            --morado-oscuro: #4332af;
            --morado-medio: #725ec3;
            --morado-claro: #a18bd7;
            --lavanda: #d0b8eb;
            --fondo-suave: #ffe5ff;
            --blanco: #ffffff;
            --error: #e74c3c;
            --exito: #2ecc71;
            --advertencia: #f39c12;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        
        .page {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* ===== Breadcrumbs ===== */
        .breadcrumbs {
            margin-bottom: 25px;
            font-size: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        
        .breadcrumbs a {
            text-decoration: none;
            color: var(--morado-oscuro);
            padding: 6px 12px;
            border-radius: 6px;
            background: var(--fondo-suave);
            transition: all 0.3s ease;
            border: 1px solid var(--lavanda);
        }
        
        .breadcrumbs a:hover {
            background: var(--lavanda);
            transform: translateY(-1px);
        }
        
        .breadcrumbs span::after {
            content: "›";
            margin-left: 8px;
            color: var(--morado-claro);
            font-weight: bold;
        }
        
        .breadcrumbs span:last-child::after {
            content: "";
        }
        
        /* ===== Contenedor principal ===== */
        .content {
            background: var(--blanco);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(67, 50, 175, 0.1);
            border: 1px solid var(--lavanda);
        }
        
        /* ===== Título ===== */
        .page-title {
            color: var(--morado-oscuro);
            margin-top: 0;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--fondo-suave);
            font-size: 28px;
            text-align: center;
        }
        
        /* ===== Banner informativo ===== */
        .info-banner {
            background: linear-gradient(135deg, var(--fondo-suave), var(--lavanda));
            border-left: 4px solid var(--morado-medio);
            padding: 15px 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            color: var(--morado-oscuro);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-banner:before {
            content: "ℹ";
            font-weight: bold;
            font-size: 16px;
            color: var(--morado-medio);
        }
        
        /* ===== Estado de carga ===== */
        .cargando-container {
            text-align: center;
            padding: 40px;
            color: var(--morado-medio);
        }
        
        .spinner {
            border: 4px solid var(--fondo-suave);
            border-top: 4px solid var(--morado-medio);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* ===== Formulario (oculto inicialmente) ===== */
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            display: none; /* Oculto hasta cargar datos */
        }
        
        .form-container.mostrar {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--morado-oscuro);
            font-size: 15px;
        }
        
        .form-label .requerido {
            color: var(--error);
            margin-left: 3px;
        }
        
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--lavanda);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background: var(--blanco);
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--morado-medio);
            box-shadow: 0 0 0 3px rgba(114, 94, 195, 0.2);
        }
        
        .form-control.invalido {
            border-color: var(--error);
            background: #ffebee;
        }
        
        .form-control.valido {
            border-color: var(--exito);
        }
        
        /* ===== Contadores y mensajes ===== */
        .contador {
            text-align: right;
            font-size: 12px;
            color: var(--morado-claro);
            margin-top: 4px;
        }
        
        .mensaje-error {
            color: var(--error);
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        
        .mensaje-error.mostrar {
            display: block;
        }
        
        /* ===== Botones ===== */
        .botones-container {
            display: flex;
            gap: 15px;
            margin-top: 35px;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            min-width: 140px;
            padding: 16px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--morado-oscuro), var(--morado-medio));
            color: white;
            box-shadow: 0 4px 12px rgba(67, 50, 175, 0.3);
        }
        
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--morado-medio), var(--morado-oscuro));
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(67, 50, 175, 0.4);
        }
        
        .btn-secondary {
            background: var(--fondo-suave);
            color: var(--morado-oscuro);
            border: 2px solid var(--lavanda);
        }
        
        .btn-secondary:hover {
            background: var(--lavanda);
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #ff6b6b);
            color: white;
        }
        
        .btn-danger:hover {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        /* ===== Feedback ===== */
        .feedback-container {
            margin-bottom: 25px;
            padding: 16px;
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .feedback-exito {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .feedback-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .feedback-advertencia {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            display: block;
        }
        
        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .page {
                padding: 15px;
            }
            
            .content {
                padding: 25px 20px;
            }
            
            .page-title {
                font-size: 24px;
                margin-bottom: 25px;
            }
            
            .form-control {
                padding: 12px 14px;
                font-size: 14px;
            }
            
            .botones-container {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                padding: 14px 20px;
            }
        }
        
        @media (max-width: 480px) {
            .content {
                padding: 20px 15px;
            }
            
            .page-title {
                font-size: 22px;
            }
            
            .form-group {
                margin-bottom: 20px;
            }
            
            .info-banner {
                padding: 12px 15px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<div class="page">
    
    <!-- Breadcrumbs automáticos desde BasePage -->
    <div class="breadcrumbs">
        <span wicket:id="breadcrumbs">
            <a wicket:id="link">
                <span wicket:id="label"></span>
            </a>
        </span>
    </div>
    
    <div class="content">
        <h1 class="page-title">Editar Usuario</h1>


        <!-- Contenedor para mensajes de feedback -->
        <div id="feedbackContainer" class="feedback-container"></div>
        
        <!-- Estado de carga -->
        <div id="cargandoContainer" class="cargando-container">
            <div class="spinner"></div>
            <div>Cargando datos del usuario...</div>
        </div>
        
        <!-- Formulario (oculto inicialmente) -->
        <div id="formContainer" class="form-container">
            <form id="formEditar">
                <!-- Campo: Nombre -->
                <div class="form-group">
                    <label class="form-label" for="nombre">
                        Nombre Completo
                        <span class="requerido">*</span>
                    </label>
                    <input type="text" 
                           id="nombre" 
                           class="form-control"
                           maxlength="70"
                           placeholder="Ej: Juan Pérez"
                           required>
                    <div class="contador" id="contadorNombre">0/70</div>
                    <div class="mensaje-error" id="errorNombre"></div>
                </div>
                
                <!-- Campo: Email -->
                <div class="form-group">
                    <label class="form-label" for="email">
                        Correo Electrónico
                        <span class="requerido">*</span>
                    </label>
                    <input type="email" 
                           id="email" 
                           class="form-control"
                           maxlength="100"
                           placeholder="Ej: usuario@correo.com"
                           required>
                    <div class="contador" id="contadorEmail">0/100</div>
                    <div class="mensaje-error" id="errorEmail"></div>
                </div>
                
                <!-- Campo: Teléfono -->
                <div class="form-group">
                    <label class="form-label" for="telefono">
                        Teléfono
                        <span class="requerido">*</span>
                    </label>
                    <input type="text" 
                           id="telefono" 
                           class="form-control"
                           maxlength="10"
                           placeholder="Ej: 5512345678"
                           required>
                    <div class="contador" id="contadorTelefono">0/10</div>
                    <div class="mensaje-error" id="errorTelefono"></div>
                </div>
                
                <!-- Campo: Fecha de Nacimiento -->
                <div class="form-group">
                    <label class="form-label" for="fechaNacimiento">
                        Fecha de Nacimiento
                        <span class="requerido">*</span>
                    </label>
                    <input type="date" 
                           id="fechaNacimiento" 
                           class="form-control"
                           required>
                    <div class="mensaje-error" id="errorFecha"></div>
                </div>
                
                <!-- Botones -->
                <div class="botones-container">
                    <button type="submit" class="btn btn-primary" id="btnGuardar">
                        Actualizar Usuario
                    </button>
                    <a href="gestion-usuarios" class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
        
        <!-- Estado de error (si no se encuentra el usuario) -->
        <div id="errorContainer" class="cargando-container" style="display: none; color: var(--error);">
            <div style="font-size: 48px; margin-bottom: 10px;">⚠</div>
            <div id="errorMensaje">Usuario no encontrado</div>
            <a href="gestion-usuarios" class="btn btn-secondary" style="margin-top: 15px;">
                Volver a Gestión de Usuarios
            </a>
        </div>
    </div>
</div>

<script>
    // URL de la API (mismo backend)
    const API_BASE_URL = window.location.origin + '/crud?action=api';
    
    // Obtener ID del usuario desde Wicket (inyectado en el HTML)
    const idUsuario = parseInt(new URLSearchParams(window.location.search).get('id') || '0');
    
    // Elementos DOM
    const formulario = document.getElementById('formEditar');
    const formContainer = document.getElementById('formContainer');
    const cargandoContainer = document.getElementById('cargandoContainer');
    const errorContainer = document.getElementById('errorContainer');
    const errorMensaje = document.getElementById('errorMensaje');
    const btnGuardar = document.getElementById('btnGuardar');
    const feedbackContainer = document.getElementById('feedbackContainer');
    
    // Campos del formulario
    const campos = {
        nombre: document.getElementById('nombre'),
        email: document.getElementById('email'),
        telefono: document.getElementById('telefono'),
        fechaNacimiento: document.getElementById('fechaNacimiento')
    };
    
    // Contadores
    const contadores = {
        nombre: document.getElementById('contadorNombre'),
        email: document.getElementById('contadorEmail'),
        telefono: document.getElementById('contadorTelefono')
    };
    
    // Mensajes de error
    const errores = {
        nombre: document.getElementById('errorNombre'),
        email: document.getElementById('errorEmail'),
        telefono: document.getElementById('errorTelefono'),
        fecha: document.getElementById('errorFecha')
    };
    
    // Variable para almacenar datos originales
    let datosOriginales = null;
    
    // ===== FUNCIONES PRINCIPALES =====
    
    // 1. Cargar datos del usuario
    async function cargarDatosUsuario() {
        if (!idUsuario || idUsuario <= 0) {
            mostrarError('ID de usuario inválido');
            return;
        }
        
        try {
            // Primero cargar todos los usuarios
            const response = await fetch(API_BASE_URL + '&metodo=listar');
            
            if (!response.ok) {
                throw new Error(`Error HTTP: ${response.status}`);
            }
            
            const usuarios = await response.json();
            
            // Buscar el usuario específico
            const usuario = usuarios.find(u => u.id === idUsuario);
            
            if (!usuario) {
                mostrarError(`Usuario con ID ${idUsuario} no encontrado`);
                return;
            }
            
            // Guardar datos originales
            datosOriginales = usuario;
            
            // Rellenar formulario
            rellenarFormulario(usuario);
            
            // Mostrar formulario
            cargandoContainer.style.display = 'none';
            formContainer.classList.add('mostrar');
            
        } catch (error) {
            console.error('Error cargando usuario:', error);
            mostrarError('Error al cargar datos del usuario: ' + error.message);
        }
    }
    
    // 2. Rellenar formulario con datos
    function rellenarFormulario(usuario) {
        if (campos.nombre) campos.nombre.value = usuario.nombre || '';
        if (campos.email) campos.email.value = usuario.email || '';
        if (campos.telefono) campos.telefono.value = usuario.telefono || '';
        
        // Formatear fecha para input type="date"
        if (usuario.fechaNacimiento && campos.fechaNacimiento) {
            const fecha = new Date(usuario.fechaNacimiento);
            const fechaFormateada = fecha.toISOString().split('T')[0];
            campos.fechaNacimiento.value = fechaFormateada;
        }
        
        // Actualizar contadores
        actualizarContadores();
        
        // Validar campos iniciales
        validarNombre();
        validarEmail();
        validarTelefono();
        validarFecha();
    }
    
    // ===== FUNCIONES DE VALIDACIÓN =====
    
    function validarNombre() {
        if (!campos.nombre) return false;
        
        const valor = campos.nombre.value.trim();
        const regex = /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/;
        
        if (!valor) {
            mostrarErrorCampo('nombre', 'El nombre es obligatorio');
            return false;
        }
        
        if (valor.length < 2) {
            mostrarErrorCampo('nombre', 'El nombre debe tener al menos 2 caracteres');
            return false;
        }
        
        if (!regex.test(valor)) {
            mostrarErrorCampo('nombre', 'Solo se permiten letras y espacios');
            return false;
        }
        
        limpiarErrorCampo('nombre');
        return true;
    }
    
    function validarEmail() {
        if (!campos.email) return false;
        
        const valor = campos.email.value.trim();
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        if (!valor) {
            mostrarErrorCampo('email', 'El correo electrónico es obligatorio');
            return false;
        }
        
        if (!regex.test(valor)) {
            mostrarErrorCampo('email', 'Ingrese un correo electrónico válido');
            return false;
        }
        
        limpiarErrorCampo('email');
        return true;
    }
    
    function validarTelefono() {
        if (!campos.telefono) return false;
        
        const valor = campos.telefono.value.trim();
        const regex = /^\d{10}$/;
        
        if (!valor) {
            mostrarErrorCampo('telefono', 'El teléfono es obligatorio');
            return false;
        }
        
        if (!regex.test(valor)) {
            mostrarErrorCampo('telefono', 'Debe contener exactamente 10 dígitos');
            return false;
        }
        
        limpiarErrorCampo('telefono');
        return true;
    }
    
    function validarFecha() {
        if (!campos.fechaNacimiento) return false;
        
        const valor = campos.fechaNacimiento.value;
        
        if (!valor) {
            mostrarErrorCampo('fecha', 'La fecha de nacimiento es obligatoria');
            return false;
        }
        
        const fechaNacimiento = new Date(valor);
        const hoy = new Date();
        const edad = hoy.getFullYear() - fechaNacimiento.getFullYear();
        
        if (fechaNacimiento > hoy) {
            mostrarErrorCampo('fecha', 'La fecha no puede ser futura');
            return false;
        }
        
        if (edad < 10 || edad > 120) {
            mostrarErrorCampo('fecha', 'La edad debe estar entre 10 y 120 años');
            return false;
        }
        
        limpiarErrorCampo('fecha');
        return true;
    }
    
    function validarFormulario() {
        return validarNombre() &&
               validarEmail() &&
               validarTelefono() &&
               validarFecha();
    }
    
    // ===== FUNCIONES DE UI =====
    
    function mostrarErrorCampo(campo, mensaje) {
        // Verificar si el campo existe
        if (campos[campo]) {
            campos[campo].classList.add('invalido');
            campos[campo].classList.remove('valido');
        }
        
        // Verificar si el mensaje de error existe
        if (errores[campo]) {
            errores[campo].textContent = mensaje;
            errores[campo].classList.add('mostrar');
        }
    }
    
    function limpiarErrorCampo(campo) {
        // Verificar si el campo existe
        if (campos[campo]) {
            campos[campo].classList.remove('invalido');
            campos[campo].classList.add('valido');
        }
        
        // Verificar si el mensaje de error existe
        if (errores[campo]) {
            errores[campo].classList.remove('mostrar');
            errores[campo].textContent = '';
        }
    }
    
    function mostrarError(mensaje) {
        if (cargandoContainer) cargandoContainer.style.display = 'none';
        if (errorMensaje) errorMensaje.textContent = mensaje;
        if (errorContainer) errorContainer.style.display = 'block';
    }
    
    function mostrarFeedback(mensaje, tipo) {
        if (!feedbackContainer) return;
        
        feedbackContainer.textContent = mensaje;
        feedbackContainer.className = `feedback-container feedback-${tipo}`;
        feedbackContainer.style.display = 'block';
        
        feedbackContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        
        if (tipo === 'exito') {
            setTimeout(() => {
                feedbackContainer.style.display = 'none';
            }, 5000);
        }
    }
    
    function mostrarCargando(mostrar) {
        if (!btnGuardar) return;
        
        if (mostrar) {
            btnGuardar.disabled = true;
            btnGuardar.innerHTML = 'Actualizando...';
        } else {
            btnGuardar.disabled = false;
            btnGuardar.innerHTML = 'Actualizar Usuario';
        }
    }
    
    // ===== FUNCIONES DE API =====
    
    async function actualizarUsuario() {
        try {
            if (!validarFormulario()) {
                mostrarFeedback('Por favor, corrija los errores en el formulario.', 'error');
                return;
            }
            
            mostrarCargando(true);
            
            const usuarioActualizado = {
                id: idUsuario,
                nombre: campos.nombre ? campos.nombre.value.trim() : '',
                email: campos.email ? campos.email.value.trim() : '',
                telefono: campos.telefono ? campos.telefono.value.trim() : '',
                fechaNacimiento: campos.fechaNacimiento ? campos.fechaNacimiento.value : ''
            };
            
            const response = await fetch(API_BASE_URL + '&metodo=actualizar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(usuarioActualizado)
            });
            
            const resultado = await response.json();
            
            if (response.ok && resultado.status === 'ok') {
    mostrarFeedback('¡Usuario actualizado exitosamente!', 'exito');
    datosOriginales = usuarioActualizado;
} else {
    mostrarFeedback('Error al actualizar el usuario. Intente nuevamente.', 'error');
}
            
        } catch (error) {
            console.error('Error:', error);
            mostrarFeedback('Error de conexión. Verifique su internet.', 'error');
        } finally {
            mostrarCargando(false);
        }
    }
    
    // ===== FUNCIONES UTILITARIAS =====
    
    function actualizarContadores() {
        if (contadores.nombre && campos.nombre) {
            contadores.nombre.textContent = `${campos.nombre.value.length}/70`;
        }
        if (contadores.email && campos.email) {
            contadores.email.textContent = `${campos.email.value.length}/100`;
        }
        if (contadores.telefono && campos.telefono) {
            contadores.telefono.textContent = `${campos.telefono.value.length}/10`;
        }
    }
    
    function soloLetras(event) {
        const charCode = event.charCode || event.keyCode;
        const charStr = String.fromCharCode(charCode);
        return /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]$/.test(charStr) || 
               charCode === 8 || charCode === 9 || charCode === 13 || charCode === 27;
    }
    
    function soloNumeros(event) {
        const charCode = event.charCode || event.keyCode;
        const charStr = String.fromCharCode(charCode);
        return /^\d$/.test(charStr) ||
               charCode === 8 || charCode === 9 || charCode === 13 || charCode === 27;
    }
    
    // ===== INICIALIZACIÓN =====
    
    document.addEventListener('DOMContentLoaded', function() {
        // Establecer fecha máxima (hoy)
        if (campos.fechaNacimiento) {
            const hoy = new Date().toISOString().split('T')[0];
            campos.fechaNacimiento.max = hoy;
        }
        
        // Cargar datos del usuario
        cargarDatosUsuario();
        
        // Eventos para contadores
        if (campos.nombre) {
            campos.nombre.addEventListener('input', function() {
                actualizarContadores();
                validarNombre();
            });
            campos.nombre.addEventListener('blur', validarNombre);
            campos.nombre.addEventListener('keypress', soloLetras);
        }
        
        if (campos.email) {
            campos.email.addEventListener('input', function() {
                actualizarContadores();
                validarEmail();
            });
            campos.email.addEventListener('blur', validarEmail);
        }
        
        if (campos.telefono) {
            campos.telefono.addEventListener('input', function() {
                actualizarContadores();
                validarTelefono();
            });
            campos.telefono.addEventListener('blur', validarTelefono);
            campos.telefono.addEventListener('keypress', soloNumeros);
        }
        
        if (campos.fechaNacimiento) {
            campos.fechaNacimiento.addEventListener('change', validarFecha);
            campos.fechaNacimiento.addEventListener('blur', validarFecha);
        }
        
        // Envío del formulario
        if (formulario) {
            formulario.addEventListener('submit', function(event) {
                event.preventDefault();
                actualizarUsuario();
            });
        }
        
    });
</script>

</body>
</html>
