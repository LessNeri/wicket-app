# Campos obligatorios
Required=El campo '${label}' es obligatorio. No puede estar vacío.

# Validaciones por patrón
PatternValidator=El campo '${label}' tiene un formato inválido.

# Email
EmailTextField=El campo '${label}' no tiene un formato de correo válido.

# Longitud
StringValidator.length=El campo '${label}' debe tener entre ${minimum} y ${maximum} caracteres.
StringValidator.maximumLength=El campo '${label}' no puede exceder los ${maximum} caracteres.
StringValidator.exactLength=El campo '${label}' debe tener exactamente ${exact} caracteres.

# Validación de nombre
nombre.PatternValidator=El nombre solo puede contener letras y espacios. No se permiten números ni caracteres especiales.

# Validación de teléfono
telefono.PatternValidator=El teléfono debe contener exactamente 10 dígitos numéricos (0-9). No se permiten letras, espacios ni caracteres especiales.
telefono.StringValidator.exactLength=El teléfono debe tener exactamente 10 dígitos.

# Validación de email
email.StringValidator.maximumLength=El correo electrónico no puede exceder los 100 caracteres.

# Validación de archivos
archivos.FileUploadField=Debe seleccionar al menos un archivo para subir.
archivos.Required=El campo '${label}' es obligatorio. Debe seleccionar al menos un archivo.

# Mensajes para upload de archivos
file.tooLarge=El archivo '${fileName}' excede el tamaño máximo permitido de ${maximumSize}
file.uploadFailed=Error al subir el archivo '${fileName}'
file.invalid=Tipo de archivo no válido

# Mensajes personalizados
campo.vacio=Este campo no puede estar vacío
telefono.longitud=El teléfono debe tener exactamente 10 dígitos
email.longitud=El correo no puede exceder 100 caracteres