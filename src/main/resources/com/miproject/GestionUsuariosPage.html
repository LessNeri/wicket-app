<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    
    <style>
        /* PALETA MORADA (se mantiene igual) */
        :root {
            --morado-oscuro: #4332af;
            --morado-medio: #725ec3;
            --morado-claro: #a18bd7;
            --lavanda: #d0b8eb;
            --fondo-suave: #ffe5ff;
            --blanco: #ffffff;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        
        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* ===== Breadcrumbs ===== */
        .breadcrumbs {
            margin-bottom: 25px;
            font-size: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        
        .breadcrumbs a {
            text-decoration: none;
            color: var(--morado-oscuro);
            padding: 6px 12px;
            border-radius: 6px;
            background: var(--fondo-suave);
            transition: all 0.3s ease;
            border: 1px solid var(--lavanda);
        }
        
        .breadcrumbs a:hover {
            background: var(--lavanda);
            transform: translateY(-1px);
        }
        
        .breadcrumbs span::after {
            content: "›";
            margin-left: 8px;
            color: var(--morado-claro);
            font-weight: bold;
        }
        
        .breadcrumbs span:last-child::after {
            content: "";
        }
        
        /* ===== Contenedor principal ===== */
        .content {
            background: var(--blanco);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(67, 50, 175, 0.1);
            border: 1px solid var(--lavanda);
        }
        
        /* ===== Título ===== */
        .page-title {
            color: var(--morado-oscuro);
            margin-top: 0;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--fondo-suave);
            font-size: 28px;
        }
        
        /* ===== Botón Registrar ===== */
        .btn-registrar {
            display: inline-flex;
            align-items: center;
            margin-bottom: 25px;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--morado-oscuro), var(--morado-medio));
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(67, 50, 175, 0.3);
            border: none;
            cursor: pointer;
        }
        
        .btn-registrar:hover {
            background: linear-gradient(135deg, var(--morado-medio), var(--morado-oscuro));
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(67, 50, 175, 0.4);
        }
        
        .btn-registrar:before {
            content: "+";
            margin-right: 8px;
            font-size: 20px;
        }
        
        /* ===== Contenedor de tabla ===== */
        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--lavanda);
            background: var(--blanco);
            box-shadow: 0 2px 8px rgba(67, 50, 175, 0.05);
        }
        
        /* ===== Tabla ===== */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        
        .data-table thead {
            background: linear-gradient(to right, var(--morado-oscuro), var(--morado-medio));
        }
        
        .data-table th {
            color: white;
            padding: 18px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 15px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .data-table th:last-child {
            border-right: none;
        }
        
        .data-table td {
            padding: 16px;
            border-bottom: 1px solid var(--fondo-suave);
            color: #333;
            font-size: 14px;
        }
        
        .data-table tr:last-child td {
            border-bottom: none;
        }
        
        .data-table tr:hover {
            background-color: var(--fondo-suave);
        }
        
        /* ===== Botones de acción ===== */
        .acciones-cell {
            white-space: nowrap;
        }
        
        .btn-accion {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            font-size: 13px;
            font-weight: 500;
            margin-right: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 70px;
        }
        
        .btn-accion:last-child {
            margin-right: 0;
        }
        
        .btn-accion i {
            margin-right: 5px;
            font-size: 12px;
        }
        
        .btn-editar {
            background: linear-gradient(135deg, var(--morado-medio), var(--morado-claro));
            border: 1px solid var(--morado-claro);
        }
        
        .btn-editar:hover {
            background: linear-gradient(135deg, var(--morado-oscuro), var(--morado-medio));
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(114, 94, 195, 0.3);
        }
        
        .btn-eliminar {
            background: linear-gradient(135deg, #e74c3c, #ff6b6b);
            border: 1px solid #ff6b6b;
        }
        
        .btn-eliminar:hover {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(231, 76, 60, 0.3);
        }
        
        /* ===== Estados ===== */
        .cargando {
            text-align: center;
            padding: 40px;
            color: var(--morado-medio);
            font-style: italic;
        }
        
        .error {
            text-align: center;
            padding: 40px;
            color: #e74c3c;
            background: #ffebee;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #ffcdd2;
        }
        
        .vacio {
            text-align: center;
            padding: 40px;
            color: var(--morado-claro);
            font-style: italic;
            background: var(--fondo-suave);
            border-radius: 8px;
        }
        
        /* ===== Responsive ===== */
        @media (max-width: 992px) {
            .page {
                padding: 15px;
            }
            
            .content {
                padding: 20px;
            }
            
            .page-title {
                font-size: 24px;
            }
            
            .btn-registrar {
                padding: 12px 24px;
                font-size: 15px;
                width: 100%;
                justify-content: center;
            }
        }
        
        @media (max-width: 768px) {
            .page {
                padding: 10px;
            }
            
            .content {
                padding: 15px;
            }
            
            .breadcrumbs {
                font-size: 13px;
            }
            
            .breadcrumbs a {
                padding: 4px 8px;
            }
            
            .data-table th,
            .data-table td {
                padding: 12px 10px;
                font-size: 13px;
            }
            
            .btn-accion {
                padding: 6px 10px;
                font-size: 12px;
                min-width: 60px;
                margin-bottom: 5px;
                display: block;
            }
            
            .btn-accion:last-child {
                margin-bottom: 0;
            }
        }
        
        @media (max-width: 480px) {
            .page-title {
                font-size: 20px;
            }
            
            .data-table {
                min-width: 600px;
            }
            
            .acciones-cell {
                min-width: 140px;
            }
        }
    </style>
</head>
<body>

<div class="page">
    
    <!-- Breadcrumbs automáticos desde BasePage -->
    <div class="breadcrumbs">
        <span wicket:id="breadcrumbs">
            <a wicket:id="link">
                <span wicket:id="label"></span>
            </a>
        </span>
    </div>
    
    <div class="content">
        <h1 class="page-title">Gestión de Usuarios</h1>
        
        <!-- Botón para registrar nuevo usuario - AHORA ES BookmarkablePageLink -->
        <a wicket:id="linkRegistrar" class="btn-registrar">
            Registrar Nuevo Usuario
        </a>
        
        <!-- ===== FILTROS ===== -->
<div style="margin-bottom: 25px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; background: var(--fondo-suave); padding: 15px; border-radius: 8px;">
    
    <!-- Buscador en tiempo real -->
    <div style="flex: 2; min-width: 250px;">
        <input type="text" 
               id="buscador"
               placeholder="Buscar por nombre..."
               style="width: 100%; padding: 12px 15px; border: 2px solid var(--lavanda); border-radius: 8px; font-size: 14px; background: white;"
               onkeyup="buscarEnTiempoReal()">
    </div>
    
    <!-- Icono para desplegar filtro de fecha -->
    <div>
        <button id="btnFiltroFecha" 
                style="background: var(--morado-medio); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px;"
                onclick="toggleFiltroFecha()">
            <span></span> Filtrar por fecha
        </button>
    </div>
    
    <!-- Selector de resultados por página -->
    <div style="display: flex; align-items: center; gap: 8px;">
        <label style="color: var(--morado-oscuro); font-weight: 500;">Mostrar:</label>
        <select id="tamanoPagina" 
                style="padding: 10px; border: 2px solid var(--lavanda); border-radius: 8px; background: white;"
                onchange="cambiarTamanoPagina()">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
        </select>
    </div>
</div>

<!-- ===== FILTRO DE FECHAS (OCULTO INICIALMENTE) ===== -->
<div id="filtroFechaContainer" 
     style="display: none; margin-bottom: 20px; padding: 20px; background: white; border: 2px solid var(--lavanda); border-radius: 8px; animation: slideDown 0.3s ease;">
    
    <div style="display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end;">
        <div style="flex: 1;">
            <label style="display: block; margin-bottom: 5px; font-weight: 600; color: var(--morado-oscuro);">Desde:</label>
            <input type="date" id="fechaDesde" style="width: 100%; padding: 10px; border: 2px solid var(--lavanda); border-radius: 8px;">
        </div>
        <div style="flex: 1;">
            <label style="display: block; margin-bottom: 5px; font-weight: 600; color: var(--morado-oscuro);">Hasta:</label>
            <input type="date" id="fechaHasta" style="width: 100%; padding: 10px; border: 2px solid var(--lavanda); border-radius: 8px;">
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="aplicarFiltroFecha()" 
                    style="background: var(--morado-oscuro); color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold;">
                Aplicar
            </button>
            <button onclick="limpiarFiltroFecha()" 
                    style="background: #e74c3c; color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold;">
                Limpiar
            </button>
        </div>
    </div>
</div>

<style>
@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

        <!-- Contenedor de la tabla -->
        <div class="table-container">
            <table class="data-table" id="tablaUsuarios">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Fecha Nacimiento</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                    <!-- Estado inicial: cargando -->
                    <tr id="filaCargando">
                        <td colspan="5" class="cargando">
                            <div>Cargando datos de usuarios...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ===== CONFIGURACIÓN =====
    const API_BASE_URL = window.location.origin + '/crud?action=api';
    
    const URLS = {
        EDITAR: 'editar',
        ELIMINAR: 'eliminar'
    };
    
    // ===== ELEMENTOS DOM =====
    const tablaCuerpo = document.getElementById('cuerpoTabla');
    const filaCargando = document.getElementById('filaCargando');
    
    // ===== ESTADO GLOBAL =====
    let paginaActual = 1;
    let tamanoPagina = 10;
    let totalResultados = 0;
    let filtros = {
        search: '',
        fechaDesde: '',
        fechaHasta: ''
    };
    let timeoutBusqueda = null;

    // ===== FUNCIONES PRINCIPALES =====
    
    async function cargarUsuariosConFiltros() {
        try {
            mostrarEstadoCargando();
            
            // Construir URL con filtros y paginación
            let url = `${API_BASE_URL}&metodo=listar`;
            url += `&pagina=${paginaActual}`;
            url += `&tamano=${tamanoPagina}`;
            
            if (filtros.search) {
                url += `&search=${encodeURIComponent(filtros.search)}`;
            }
            if (filtros.fechaDesde) {
                url += `&fechaDesde=${filtros.fechaDesde}`;
            }
            if (filtros.fechaHasta) {
                url += `&fechaHasta=${filtros.fechaHasta}`;
            }
            
            const response = await fetch(url);
            
            if (!response.ok) {
                throw new Error(`Error HTTP: ${response.status}`);
            }
            
            const data = await response.json();  // { usuarios: [], total: 123 }
            
            if (data.usuarios.length === 0) {
                mostrarEstadoVacio();
            } else {
                renderizarTabla(data.usuarios);
                totalResultados = data.total;
                renderizarPaginacion();
            }
            
        } catch (error) {
            console.error('Error cargando usuarios:', error);
            mostrarEstadoError('Error al cargar los datos: ' + error.message);
        }
    }

    function renderizarTabla(usuarios) {
        tablaCuerpo.innerHTML = '';
        
        usuarios.forEach(usuario => {
            const fila = document.createElement('tr');
            
            const fechaFormateada = usuario.fechaNacimiento 
                ? new Date(usuario.fechaNacimiento).toLocaleDateString('es-ES')
                : '-';
            
            const urlEditar = `${URLS.EDITAR}?id=${usuario.id}`;
            const urlEliminar = `${URLS.ELIMINAR}?id=${usuario.id}`;
            
            fila.innerHTML = `
                <td>${escapeHTML(usuario.nombre || '')}</td>
                <td>${escapeHTML(usuario.email || '')}</td>
                <td>${escapeHTML(usuario.telefono || '')}</td>
                <td>${fechaFormateada}</td>
                <td class="acciones-cell">
                    <a href="${urlEditar}" class="btn-accion btn-editar">Editar</a>
                    <a href="${urlEliminar}" class="btn-accion btn-eliminar">Eliminar</a>
                </td>
            `;
            
            tablaCuerpo.appendChild(fila);
        });
    }

    // ===== FILTROS Y BÚSQUEDA =====
    
    function toggleFiltroFecha() {
        const container = document.getElementById('filtroFechaContainer');
        const btn = document.getElementById('btnFiltroFecha');
        
        if (!container) return;
        
        if (container.style.display === 'none' || container.style.display === '') {
            container.style.display = 'block';
            if (btn) btn.style.background = 'var(--morado-oscuro)';
        } else {
            container.style.display = 'none';
            if (btn) btn.style.background = 'var(--morado-medio)';
        }
    }

    function aplicarFiltroFecha() {
        filtros.fechaDesde = document.getElementById('fechaDesde')?.value || '';
        filtros.fechaHasta = document.getElementById('fechaHasta')?.value || '';
        paginaActual = 1;
        cargarUsuariosConFiltros();
        toggleFiltroFecha();
    }

    function limpiarFiltroFecha() {
        const desde = document.getElementById('fechaDesde');
        const hasta = document.getElementById('fechaHasta');
        if (desde) desde.value = '';
        if (hasta) hasta.value = '';
        filtros.fechaDesde = '';
        filtros.fechaHasta = '';
        paginaActual = 1;
        cargarUsuariosConFiltros();
    }

    function buscarEnTiempoReal() {
        clearTimeout(timeoutBusqueda);
        timeoutBusqueda = setTimeout(() => {
            filtros.search = document.getElementById('buscador')?.value || '';
            paginaActual = 1;
            cargarUsuariosConFiltros();
        }, 300);
    }

    function cambiarTamanoPagina() {
        const select = document.getElementById('tamanoPagina');
        if (select) {
            tamanoPagina = parseInt(select.value);
            paginaActual = 1;
            cargarUsuariosConFiltros();
        }
    }

    function irPagina(pagina) {
        paginaActual = pagina;
        cargarUsuariosConFiltros();
    }

    // ===== PAGINACIÓN =====
    
    function renderizarPaginacion() {
        const totalPaginas = Math.ceil(totalResultados / tamanoPagina);
        
        let paginacionDiv = document.getElementById('paginacion');
        if (!paginacionDiv) {
            paginacionDiv = document.createElement('div');
            paginacionDiv.id = 'paginacion';
            paginacionDiv.style.marginTop = '20px';
            paginacionDiv.style.display = 'flex';
            paginacionDiv.style.justifyContent = 'center';
            paginacionDiv.style.gap = '5px';
            paginacionDiv.style.flexWrap = 'wrap';
            document.querySelector('.content').appendChild(paginacionDiv);
        }
        
        let html = '';
        
        // Botón Anterior
        html += `<button onclick="irPagina(${paginaActual - 1})" 
            style="padding: 8px 12px; background: ${paginaActual === 1 ? '#ccc' : 'var(--morado-medio)'}; color: white; border: none; border-radius: 4px; cursor: ${paginaActual === 1 ? 'not-allowed' : 'pointer'};"
            ${paginaActual === 1 ? 'disabled' : ''}>
            Anterior
        </button>`;
        
        // Números de página (máximo 5)
        const inicio = Math.max(1, paginaActual - 2);
        const fin = Math.min(totalPaginas, inicio + 4);
        
        for (let i = inicio; i <= fin; i++) {
            html += `<button onclick="irPagina(${i})" 
                style="padding: 8px 12px; background: ${i === paginaActual ? 'var(--morado-oscuro)' : 'var(--morado-claro)'}; color: white; border: none; border-radius: 4px; cursor: pointer;">
                ${i}
            </button>`;
        }
        
        // Botón Siguiente
        html += `<button onclick="irPagina(${paginaActual + 1})" 
            style="padding: 8px 12px; background: ${paginaActual === totalPaginas ? '#ccc' : 'var(--morado-medio)'}; color: white; border: none; border-radius: 4px; cursor: ${paginaActual === totalPaginas ? 'not-allowed' : 'pointer'};"
            ${paginaActual === totalPaginas ? 'disabled' : ''}>
            Siguiente
        </button>`;
        
        // Texto informativo
        const desde = ((paginaActual - 1) * tamanoPagina) + 1;
        const hasta = Math.min(paginaActual * tamanoPagina, totalResultados);
        
        html += `<div style="margin-left: 15px; color: var(--morado-oscuro); align-self: center;">
            Mostrando ${desde} - ${hasta} de ${totalResultados}
        </div>`;
        
        paginacionDiv.innerHTML = html;
    }

    // ===== ESTADOS UI =====
    
    function mostrarEstadoCargando() {
        tablaCuerpo.innerHTML = `
            <tr id="filaCargando">
                <td colspan="5" class="cargando">
                    <div>Cargando datos de usuarios...</div>
                </td>
            </tr>
        `;
        // Eliminar paginación mientras carga
        const pagDiv = document.getElementById('paginacion');
        if (pagDiv) pagDiv.innerHTML = '';
    }

    function mostrarEstadoError(mensaje) {
        tablaCuerpo.innerHTML = `
            <tr>
                <td colspan="5" class="error">
                    <div>${escapeHTML(mensaje)}</div>
                    <button onclick="cargarUsuariosConFiltros()" style="
                        margin-top: 10px;
                        padding: 8px 16px;
                        background: var(--morado-medio);
                        color: white;
                        border: none;
                        border-radius: 4px;
                        cursor: pointer;
                    ">
                        Reintentar
                    </button>
                </td>
            </tr>
        `;
    }

    function mostrarEstadoVacio() {
        tablaCuerpo.innerHTML = `
            <tr>
                <td colspan="5" class="vacio">
                    <div>No hay usuarios registrados</div>
                    <div style="margin-top: 10px; font-size: 13px;">
                        Haz clic en "Registrar Nuevo Usuario" para agregar el primero.
                    </div>
                </td>
            </tr>
        `;
    }

    function escapeHTML(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ===== INICIALIZACIÓN =====
    
    document.addEventListener('DOMContentLoaded', function() {
        cargarUsuariosConFiltros();
    });

    window.cargarUsuariosConFiltros = cargarUsuariosConFiltros;
    window.toggleFiltroFecha = toggleFiltroFecha;
    window.aplicarFiltroFecha = aplicarFiltroFecha;
    window.limpiarFiltroFecha = limpiarFiltroFecha;
    window.buscarEnTiempoReal = buscarEnTiempoReal;
    window.cambiarTamanoPagina = cambiarTamanoPagina;
    window.irPagina = irPagina;
</script>

</body>
</html>
