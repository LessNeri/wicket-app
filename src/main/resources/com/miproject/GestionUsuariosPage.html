<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    
    <style>
        /* PALETA MORADA (se mantiene igual) */
        :root {
            --morado-oscuro: #4332af;
            --morado-medio: #725ec3;
            --morado-claro: #a18bd7;
            --lavanda: #d0b8eb;
            --fondo-suave: #ffe5ff;
            --blanco: #ffffff;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        
        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* ===== Breadcrumbs ===== */
        .breadcrumbs {
            margin-bottom: 25px;
            font-size: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        
        .breadcrumbs a {
            text-decoration: none;
            color: var(--morado-oscuro);
            padding: 6px 12px;
            border-radius: 6px;
            background: var(--fondo-suave);
            transition: all 0.3s ease;
            border: 1px solid var(--lavanda);
        }
        
        .breadcrumbs a:hover {
            background: var(--lavanda);
            transform: translateY(-1px);
        }
        
        .breadcrumbs span::after {
            content: "›";
            margin-left: 8px;
            color: var(--morado-claro);
            font-weight: bold;
        }
        
        .breadcrumbs span:last-child::after {
            content: "";
        }
        
        /* ===== Contenedor principal ===== */
        .content {
            background: var(--blanco);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(67, 50, 175, 0.1);
            border: 1px solid var(--lavanda);
        }
        
        /* ===== Título ===== */
        .page-title {
            color: var(--morado-oscuro);
            margin-top: 0;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--fondo-suave);
            font-size: 28px;
        }
        
        /* ===== Botón Registrar ===== */
        .btn-registrar {
            display: inline-flex;
            align-items: center;
            margin-bottom: 25px;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--morado-oscuro), var(--morado-medio));
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(67, 50, 175, 0.3);
            border: none;
            cursor: pointer;
        }
        
        .btn-registrar:hover {
            background: linear-gradient(135deg, var(--morado-medio), var(--morado-oscuro));
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(67, 50, 175, 0.4);
        }
        
        .btn-registrar:before {
            content: "+";
            margin-right: 8px;
            font-size: 20px;
        }
        
        /* ===== Contenedor de tabla ===== */
        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--lavanda);
            background: var(--blanco);
            box-shadow: 0 2px 8px rgba(67, 50, 175, 0.05);
        }
        
        /* ===== Tabla ===== */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        
        .data-table thead {
            background: linear-gradient(to right, var(--morado-oscuro), var(--morado-medio));
        }
        
        .data-table th {
            color: white;
            padding: 18px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 15px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .data-table th:last-child {
            border-right: none;
        }
        
        .data-table td {
            padding: 16px;
            border-bottom: 1px solid var(--fondo-suave);
            color: #333;
            font-size: 14px;
        }
        
        .data-table tr:last-child td {
            border-bottom: none;
        }
        
        .data-table tr:hover {
            background-color: var(--fondo-suave);
        }
        
        /* ===== Botones de acción ===== */
        .acciones-cell {
            white-space: nowrap;
        }
        
        .btn-accion {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            font-size: 13px;
            font-weight: 500;
            margin-right: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 70px;
        }
        
        .btn-accion:last-child {
            margin-right: 0;
        }
        
        .btn-accion i {
            margin-right: 5px;
            font-size: 12px;
        }
        
        .btn-editar {
            background: linear-gradient(135deg, var(--morado-medio), var(--morado-claro));
            border: 1px solid var(--morado-claro);
        }
        
        .btn-editar:hover {
            background: linear-gradient(135deg, var(--morado-oscuro), var(--morado-medio));
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(114, 94, 195, 0.3);
        }
        
        .btn-eliminar {
            background: linear-gradient(135deg, #e74c3c, #ff6b6b);
            border: 1px solid #ff6b6b;
        }
        
        .btn-eliminar:hover {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(231, 76, 60, 0.3);
        }
        
        /* ===== Estados ===== */
        .cargando {
            text-align: center;
            padding: 40px;
            color: var(--morado-medio);
            font-style: italic;
        }
        
        .error {
            text-align: center;
            padding: 40px;
            color: #e74c3c;
            background: #ffebee;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #ffcdd2;
        }
        
        .vacio {
            text-align: center;
            padding: 40px;
            color: var(--morado-claro);
            font-style: italic;
            background: var(--fondo-suave);
            border-radius: 8px;
        }
        
        /* ===== Responsive ===== */
        @media (max-width: 992px) {
            .page {
                padding: 15px;
            }
            
            .content {
                padding: 20px;
            }
            
            .page-title {
                font-size: 24px;
            }
            
            .btn-registrar {
                padding: 12px 24px;
                font-size: 15px;
                width: 100%;
                justify-content: center;
            }
        }
        
        @media (max-width: 768px) {
            .page {
                padding: 10px;
            }
            
            .content {
                padding: 15px;
            }
            
            .breadcrumbs {
                font-size: 13px;
            }
            
            .breadcrumbs a {
                padding: 4px 8px;
            }
            
            .data-table th,
            .data-table td {
                padding: 12px 10px;
                font-size: 13px;
            }
            
            .btn-accion {
                padding: 6px 10px;
                font-size: 12px;
                min-width: 60px;
                margin-bottom: 5px;
                display: block;
            }
            
            .btn-accion:last-child {
                margin-bottom: 0;
            }
        }
        
        @media (max-width: 480px) {
            .page-title {
                font-size: 20px;
            }
            
            .data-table {
                min-width: 600px;
            }
            
            .acciones-cell {
                min-width: 140px;
            }
        }
    </style>
</head>
<body>

<div class="page">
    
    <!-- Breadcrumbs automáticos desde BasePage -->
    <div class="breadcrumbs">
        <span wicket:id="breadcrumbs">
            <a wicket:id="link">
                <span wicket:id="label"></span>
            </a>
        </span>
    </div>
    
    <div class="content">
        <h1 class="page-title">Gestión de Usuarios</h1>
        
        <!-- Botón para registrar nuevo usuario - AHORA ES BookmarkablePageLink -->
        <a wicket:id="linkRegistrar" class="btn-registrar">
            Registrar Nuevo Usuario
        </a>
        
        <!-- Contenedor de la tabla -->
        <div class="table-container">
            <table class="data-table" id="tablaUsuarios">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Fecha Nacimiento</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                    <!-- Estado inicial: cargando -->
                    <tr id="filaCargando">
                        <td colspan="6" class="cargando">
                            <div>Cargando datos de usuarios...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // URL de la API (usando CrudPage existente como backend)
    const API_BASE_URL = window.location.origin + '/crud?action=api';
    
    // URLs de las páginas Wicket
    // Estas deben coincidir con las rutas montadas en WicketApplication
    const URLS = {
        EDITAR: 'editar',      // Para EditarUsuarioPage
        ELIMINAR: 'eliminar'   // Para EliminarUsuarioPage
    };
    
    // Elementos DOM
    const tablaCuerpo = document.getElementById('cuerpoTabla');
    const filaCargando = document.getElementById('filaCargando');
    
    // ===== FUNCIONES PRINCIPALES =====
    
    // 1. Cargar usuarios desde la API
    async function cargarUsuarios() {
        try {
            mostrarEstadoCargando();
            
            const response = await fetch(API_BASE_URL + '&metodo=listar');
            
            if (!response.ok) {
                throw new Error(`Error HTTP: ${response.status}`);
            }
            
            const usuarios = await response.json();
            
            if (usuarios.length === 0) {
                mostrarEstadoVacio();
            } else {
                renderizarTabla(usuarios);
            }
            
        } catch (error) {
            console.error('Error cargando usuarios:', error);
            mostrarEstadoError('Error al cargar los datos: ' + error.message);
        }
    }
    
    // 2. Renderizar la tabla con datos
    function renderizarTabla(usuarios) {
        tablaCuerpo.innerHTML = '';
        
        usuarios.forEach(usuario => {
            const fila = document.createElement('tr');
            
            // Formatear fecha (si existe)
            const fechaFormateada = usuario.fechaNacimiento 
                ? new Date(usuario.fechaNacimiento).toLocaleDateString('es-ES')
                : '-';
            
            // Generar URLs para las páginas Wicket con parámetros
            const urlEditar = `${URLS.EDITAR}?id=${usuario.id}`;
            const urlEliminar = `${URLS.ELIMINAR}?id=${usuario.id}`;
            
            fila.innerHTML = `
                <td>${escapeHTML(usuario.nombre || '')}</td>
                <td>${escapeHTML(usuario.email || '')}</td>
                <td>${escapeHTML(usuario.telefono || '')}</td>
                <td>${fechaFormateada}</td>
                <td class="acciones-cell">
                    <a href="${urlEditar}" class="btn-accion btn-editar" title="Editar usuario">
                        Editar
                    </a>
                    <a href="${urlEliminar}" class="btn-accion btn-eliminar" title="Eliminar usuario">
                        Eliminar
                    </a>
                </td>
            `;
            
            tablaCuerpo.appendChild(fila);
        });
    }
    
    
    function mostrarEstadoCargando() {
        tablaCuerpo.innerHTML = `
            <tr id="filaCargando">
                <td colspan="5" class="cargando">
                    <div>Cargando datos de usuarios...</div>
                </td>
            </tr>
        `;
    }
    
    function mostrarEstadoError(mensaje) {
        tablaCuerpo.innerHTML = `
            <tr>
                <td colspan="5" class="error">
                    <div>${escapeHTML(mensaje)}</div>
                    <button onclick="cargarUsuarios()" style="
                        margin-top: 10px;
                        padding: 8px 16px;
                        background: var(--morado-medio);
                        color: white;
                        border: none;
                        border-radius: 4px;
                        cursor: pointer;
                    ">
                        Reintentar
                    </button>
                </td>
            </tr>
        `;
    }
    
    function mostrarEstadoVacio() {
        tablaCuerpo.innerHTML = `
            <tr>
                <td colspan="5" class="vacio">
                    <div>No hay usuarios registrados</div>
                    <div style="margin-top: 10px; font-size: 13px;">
                        Haz clic en "Registrar Nuevo Usuario" para agregar el primero.
                    </div>
                </td>
            </tr>
        `;
    }
    
    // ===== FUNCIONES UTILITARIAS =====
    
    function escapeHTML(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    
    document.addEventListener('DOMContentLoaded', function() {
        cargarUsuarios();
    });
    
    // Hacer función accesible globalmente para reintentos
    window.cargarUsuarios = cargarUsuarios;
</script>

</body>
</html>
