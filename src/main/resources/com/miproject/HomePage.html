<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>

    <style>
        .welcome-card { background: #ffffff; padding: 30px; border-radius: 20px; margin-bottom: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); text-align: center; }
        .welcome-card h1 { color: #4332af; margin-bottom: 10px; }
        .carousel-container { background: #ffffff; border-radius: 20px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .carousel { position: relative; overflow: hidden; border-radius: 15px; }
        .carousel-track { display: flex; transition: transform 0.5s ease; }
        .carousel-slide { min-width: 100%; }
        .carousel-slide img { width: 100%; height: 400px; object-fit: cover; }
        .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; padding: 12px 18px; cursor: pointer; border-radius: 50%; transition: all 0.3s ease; }
        .carousel-btn:hover { background: rgba(0,0,0,0.8); }
        .carousel-prev { left: 15px; }
        .carousel-next { right: 15px; }
        .upload-section { margin-top: 20px; padding: 20px; background: #ffe5ff; border-radius: 15px; text-align: center; }
        .btn-subir { background: #4332af; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>

    <div class="welcome-card">
        <h1 wicket:id="mensajeBienvenida">Bienvenido al Sistema</h1>
        <p>Seleccione una opción del menú lateral para comenzar</p>
    </div>

    <div wicket:id="carouselContainer" class="carousel-container">
        <div class="carousel">
            <div class="carousel-track" id="carouselTrack"></div>
            <button class="carousel-btn carousel-prev" onclick="prevSlide()">‹</button>
            <button class="carousel-btn carousel-next" onclick="nextSlide()">›</button>
        </div>
        <span wicket:id="carouselData" id="carouselData" style="display:none"></span>
        
        <div class="upload-section">
            <form wicket:id="uploadForm" enctype="multipart/form-data">
                <input type="file" wicket:id="imageUpload" accept="image/*">
                <br>
                <button type="submit" wicket:id="btnSubirImagen" class="btn-subir">Subir imagen al carrusel</button>
            </form>
        </div>
        <div wicket:id="feedback" class="feedback"></div>
    </div>

    <script>
        let currentIndex = 0;
        let images = [];
        let autoInterval;

        function initCarousel() {
            const dataElem = document.getElementById('carouselData');
            if (!dataElem) return;
            try {
                images = JSON.parse(dataElem.textContent);
            } catch(e) {
                images = dataElem.textContent.split(',').filter(img => img.trim());
            }
            if (images.length === 0) return;
            const track = document.getElementById('carouselTrack');
            track.innerHTML = '';
            images.forEach(img => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                slide.innerHTML = `<img src="${img}" alt="Imagen">`;
                track.appendChild(slide);
            });
            startAutoSlide();
        }
        
        function goToSlide(index) {
            if (images.length === 0) return;
            if (index < 0) index = images.length - 1;
            if (index >= images.length) index = 0;
            currentIndex = index;
            const track = document.getElementById('carouselTrack');
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            resetAutoSlide();
        }
        
        function nextSlide() { goToSlide(currentIndex + 1); }
        function prevSlide() { goToSlide(currentIndex - 1); }
        
        function startAutoSlide() {
            if (autoInterval) clearInterval(autoInterval);
            autoInterval = setInterval(nextSlide, 5000);
        }
        
        function resetAutoSlide() {
            clearInterval(autoInterval);
            startAutoSlide();
        }
        
        document.addEventListener('DOMContentLoaded', initCarousel);
        window.initCarousel = initCarousel;
        window.nextSlide = nextSlide;
        window.prevSlide = prevSlide;
    </script>
</wicket:extend>
</body>
</html>
