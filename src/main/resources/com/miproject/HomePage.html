<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="utf-8">
    <title>Hola Mundo Wicket</title>

    <!-- Script hCaptcha -->
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #333;
        }

        .btn {
            background: #4CAF50;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }

        .btn:hover {
            background: #45a049;
        }

        .feedback {
            margin: 20px;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            min-width: 300px;
        }

        .captcha-container {
            margin: 25px 0;
        }
    </style>
</head>
<body>

<h1 wicket:id="mensaje"></h1>
<p wicket:id="nombre"></p>

<div wicket:id="feedback" class="feedback"></div>

<form wicket:id="formInsertar">

    <!-- Botón mostrar captcha -->
    <button type="submit" class="btn" wicket:id="btnCaptcha">
        Ir al captcha
    </button>

    <!-- Captcha oculto -->
    <div wicket:id="captchaContainer" class="captcha-container">
        <div class="h-captcha"
             data-sitekey="d68a0486-cdb2-4b46-869c-361675f82c5e"
             data-theme="light">
        </div>
    </div>

    <!-- Botón insertar -->
    <button type="submit" class="btn" wicket:id="btnInsertar">
        Insertar datos
    </button>

</form>

</body>
</html>
