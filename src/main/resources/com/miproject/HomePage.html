<wicket:extend>
    <wicket:head>
        <style>
            :root {
                --morado-oscuro: #4332af;
                --morado-medio: #725ec3;
                --morado-claro: #a18bd7;
                --lavanda: #d0b8eb;
                --fondo-suave: #f9f7ff;
                --blanco: #ffffff;
                --sombra: rgba(0, 0, 0, 0.08);
            }

            /* Contenedor principal que ocupa el alto disponible para centrar */
            .home-container {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 75vh; /* Centra verticalmente en la pantalla */
                padding: 20px;
            }

            .welcome-card {
                background: var(--blanco);
                padding: 50px 40px;
                border-radius: 24px;
                box-shadow: 0 10px 40px var(--sombra);
                border: 1px solid var(--lavanda);
                text-align: center;
                max-width: 600px;
                width: 100%;
                transition: transform 0.3s ease;
            }

            .welcome-card:hover {
                transform: translateY(-5px);
            }

            .icon-circle {
                width: 80px;
                height: 80px;
                background: var(--fondo-suave);
                color: var(--morado-oscuro);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 35px;
                margin: 0 auto 25px;
                border: 2px solid var(--lavanda);
            }

            .welcome-card h1 {
                color: var(--morado-oscuro);
                font-size: 32px;
                margin-bottom: 15px;
                font-weight: 700;
            }

            .welcome-card p {
                color: #666;
                font-size: 16px;
                line-height: 1.6;
                margin-bottom: 30px;
            }

            /* Decoración de accesos rápidos para "llenar" el diseño */
            .quick-steps {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
                margin-top: 20px;
            }

            .step-item {
                padding: 15px;
                background: var(--fondo-suave);
                border-radius: 15px;
                font-size: 13px;
                color: var(--morado-medio);
                font-weight: 600;
            }

            .step-item i {
                display: block;
                margin-bottom: 8px;
                font-size: 18px;
            }
        </style>
    </wicket:head>

    <div class="home-container">
        <div class="welcome-card">
            <div class="icon-circle">
                <i class="fas fa-rocket"></i>
            </div>
            
            <h1 wicket:id="mensajeBienvenida">Bienvenido al Sistema</h1>
            
            <p>
                Has ingresado correctamente al panel administrativo. 
                Utiliza el menú lateral para gestionar clientes, configurar módulos 
                y administrar permisos de usuario.
            </p>

            <div class="quick-steps">
                <div class="step-item">
                    <i class="fas fa-search"></i>
                    Consulta
                </div>
                <div class="step-item">
                    <i class="fas fa-plus-circle"></i>
                    Registra
                </div>
                <div class="step-item">
                    <i class="fas fa-shield-alt"></i>
                    Seguro
                </div>
            </div>
        </div>
    </div>
</wicket:extend>
