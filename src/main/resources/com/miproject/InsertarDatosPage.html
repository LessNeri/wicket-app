<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="utf-8">
    <title>Insertar Datos</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }
        .btn {
            background: #4CAF50;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        .btn:hover {
            background: #45a049;
        }
        .feedback {
            margin: 20px;
            padding: 10px;
            border-radius: 5px;
            min-width: 300px;
            display: inline-block;
        }
    </style>
</head>
<body>

<!-- ESTA LÍNEA ES OBLIGATORIA -->
<wicket:extend>

<h1 wicket:id="titulo"></h1>

<div wicket:id="feedback" class="feedback"></div>

<form wicket:id="formInsertar">
    <button type="submit" class="btn" wicket:id="btnInsertar">
        Insertar Datos
    </button>
</form>

<br>

<a class="btn" wicket:id="btnIrFormulario">
    Ir al Formulario
</a>

<!-- ESTA LÍNEA TAMBIÉN ES OBLIGATORIA -->
</wicket:extend>

</body>
</html>
