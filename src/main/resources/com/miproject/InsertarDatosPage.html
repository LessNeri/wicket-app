<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="utf-8">
    <title>Insertar Datos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .form-container {
            display: inline-block;
            text-align: left;
            padding: 25px 35px;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"], input[type="email"], input[type="date"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="file"] {
            padding: 5px;
            background: #f8f8f8;
        }

        .requerido {
            color: #d32f2f;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        .feedback {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 4px;
            background: #f8f8f8;
            min-width: 300px;
        }

        .success {
            color: #388e3c;
            background-color: #e8f5e9;
            border: 1px solid #c8e6c9;
        }

        .error {
            color: #d32f2f;
            background-color: #ffebee;
            border: 1px solid #ffcdd2;
        }

        .btn {
    display: inline-block;
    padding: 12px 26px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    text-decoration: none;
    transition: all 0.25s ease;
}

.btn-primary {
    background: #4CAF50;
    color: white;
}

.btn-primary:hover {
    background: #43a047;
    transform: translateY(-1px);
}

.btn-secondary {
    background: #1976D2;
    color: white;
}

.btn-secondary:hover {
    background: #1565C0;
    transform: translateY(-1px);
}

    </style>
</head>
<body>
<wicket:extend>

<h1 wicket:id="titulo"></h1>

<div wicket:id="feedback" class="feedback"></div>

<form wicket:id="formInsertar" class="form-container">
    <button type="submit" wicket:id="btnInsertar">
        Insertar datos en SQL
    </button>
</form>

<br><br>

<a wicket:id="btnIrFormulario">
    Ir al Formulario
</a>

</wicket:extend>
</body>
</html>
