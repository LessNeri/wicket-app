<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Usuario</title>
    
    <style>
        /* PALETA MORADA (consistente) */
        :root {
            --morado-oscuro: #4332af;
            --morado-medio: #725ec3;
            --morado-claro: #a18bd7;
            --lavanda: #d0b8eb;
            --fondo-suave: #ffe5ff;
            --blanco: #ffffff;
            --error: #e74c3c;
            --exito: #2ecc71;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        
        .page {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* ===== Breadcrumbs ===== */
        .breadcrumbs {
            margin-bottom: 25px;
            font-size: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        
        .breadcrumbs a {
            text-decoration: none;
            color: var(--morado-oscuro);
            padding: 6px 12px;
            border-radius: 6px;
            background: var(--fondo-suave);
            transition: all 0.3s ease;
            border: 1px solid var(--lavanda);
        }
        
        .breadcrumbs a:hover {
            background: var(--lavanda);
            transform: translateY(-1px);
        }
        
        .breadcrumbs span::after {
            content: "›";
            margin-left: 8px;
            color: var(--morado-claro);
            font-weight: bold;
        }
        
        .breadcrumbs span:last-child::after {
            content: "";
        }
        
        /* ===== Contenedor principal ===== */
        .content {
            background: var(--blanco);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(67, 50, 175, 0.1);
            border: 1px solid var(--lavanda);
        }
        
        /* ===== Título ===== */
        .page-title {
            color: var(--morado-oscuro);
            margin-top: 0;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--fondo-suave);
            font-size: 28px;
            text-align: center;
        }
        
        /* ===== Formulario ===== */
        .form-container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--morado-oscuro);
            font-size: 15px;
        }
        
        .form-label .requerido {
            color: var(--error);
            margin-left: 3px;
        }
        
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--lavanda);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background: var(--blanco);
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--morado-medio);
            box-shadow: 0 0 0 3px rgba(114, 94, 195, 0.2);
        }
        
        .form-control.invalido {
            border-color: var(--error);
            background: #ffebee;
        }
        
        .form-control.valido {
            border-color: var(--exito);
        }
        
        /* ===== Contadores y mensajes ===== */
        .contador {
            text-align: right;
            font-size: 12px;
            color: var(--morado-claro);
            margin-top: 4px;
        }
        
        .mensaje-error {
            color: var(--error);
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        
        .mensaje-error.mostrar {
            display: block;
        }
        
        /* ===== Botones ===== */
        .botones-container {
            display: flex;
            gap: 15px;
            margin-top: 35px;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            min-width: 140px;
            padding: 16px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--morado-oscuro), var(--morado-medio));
            color: white;
            box-shadow: 0 4px 12px rgba(67, 50, 175, 0.3);
        }
        
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--morado-medio), var(--morado-oscuro));
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(67, 50, 175, 0.4);
        }
        
        .btn-secondary {
            background: var(--fondo-suave);
            color: var(--morado-oscuro);
            border: 2px solid var(--lavanda);
        }
        
        .btn-secondary:hover {
            background: var(--lavanda);
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        /* ===== Feedback ===== */
        .feedback-container {
            margin-bottom: 25px;
            padding: 16px;
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .feedback-exito {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .feedback-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .page {
                padding: 15px;
            }
            
            .content {
                padding: 25px 20px;
            }
            
            .page-title {
                font-size: 24px;
                margin-bottom: 25px;
            }
            
            .form-control {
                padding: 12px 14px;
                font-size: 14px;
            }
            
            .botones-container {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                padding: 14px 20px;
            }
        }
        
        @media (max-width: 480px) {
            .content {
                padding: 20px 15px;
            }
            
            .page-title {
                font-size: 22px;
            }
            
            .form-group {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

<div class="page">
    
    <!-- Breadcrumbs automáticos desde BasePage -->
    <div class="breadcrumbs">
        <span wicket:id="breadcrumbs">
            <a wicket:id="link">
                <span wicket:id="label"></span>
            </a>
        </span>
    </div>
    
    <div class="content">
        <h1 class="page-title">Registrar Nuevo Usuario</h1>
        
        <!-- Contenedor para mensajes de feedback -->
        <div id="feedbackContainer" class="feedback-container"></div>
        
        <div class="form-container">
            <form id="formRegistrar">
                <!-- Campo: Nombre -->
                <div class="form-group">
                    <label class="form-label" for="nombre">
                        Nombre Completo
                        <span class="requerido">*</span>
                    </label>
                    <input type="text" 
                           id="nombre" 
                           class="form-control"
                           maxlength="70"
                           placeholder="Ej: Juan Pérez"
                           required>
                    <div class="contador" id="contadorNombre">0/70</div>
                    <div class="mensaje-error" id="errorNombre"></div>
                </div>
                
                <!-- Campo: Email -->
                <div class="form-group">
                    <label class="form-label" for="email">
                        Correo Electrónico
                        <span class="requerido">*</span>
                    </label>
                    <input type="email" 
                           id="email" 
                           class="form-control"
                           maxlength="100"
                           placeholder="Ej: usuario@correo.com"
                           required>
                    <div class="contador" id="contadorEmail">0/100</div>
                    <div class="mensaje-error" id="errorEmail"></div>
                </div>
                
                <!-- Campo: Teléfono -->
                <div class="form-group">
                    <label class="form-label" for="telefono">
                        Teléfono
                        <span class="requerido">*</span>
                    </label>
                    <input type="text" 
                           id="telefono" 
                           class="form-control"
                           maxlength="10"
                           placeholder="Ej: 5512345678"
                           required>
                    <div class="contador" id="contadorTelefono">0/10</div>
                    <div class="mensaje-error" id="errorTelefono"></div>
                </div>
                
                <!-- Campo: Fecha de Nacimiento -->
                <div class="form-group">
                    <label class="form-label" for="fechaNacimiento">
                        Fecha de Nacimiento
                        <span class="requerido">*</span>
                    </label>
                    <input type="date" 
                           id="fechaNacimiento" 
                           class="form-control"
                           required>
                        <div class="mensaje-error" id="errorFecha"></div>
                </div>
                
                <!-- Botones -->
                <div class="botones-container">
                    <button type="submit" class="btn btn-primary" id="btnGuardar">
                        Guardar Usuario
                    </button>
                    <a href="javascript:history.back()" class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // URL de la API (mismo backend que GestionUsuariosPage)
    const API_BASE_URL = window.location.origin + '/crud?action=api';
    
    // Elementos DOM
    const formulario = document.getElementById('formRegistrar');
    const btnGuardar = document.getElementById('btnGuardar');
    const feedbackContainer = document.getElementById('feedbackContainer');
    
    // Campos del formulario
    const campos = {
        nombre: document.getElementById('nombre'),
        email: document.getElementById('email'),
        telefono: document.getElementById('telefono'),
        fechaNacimiento: document.getElementById('fechaNacimiento')
    };
    
    // Contadores
    const contadores = {
        nombre: document.getElementById('contadorNombre'),
        email: document.getElementById('contadorEmail'),
        telefono: document.getElementById('contadorTelefono')
    };
    
    // Mensajes de error
    const errores = {
        nombre: document.getElementById('errorNombre'),
        email: document.getElementById('errorEmail'),
        telefono: document.getElementById('errorTelefono'),
        fecha: document.getElementById('errorFecha')
    };
    
    // ===== FUNCIONES DE VALIDACIÓN =====
    
    // Validar nombre (solo letras y espacios)
    function validarNombre() {
        const valor = campos.nombre.value.trim();
        const regex = /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/;
        
        if (!valor) {
            mostrarError('nombre', 'El nombre es obligatorio');
            return false;
        }
        
        if (valor.length < 2) {
            mostrarError('nombre', 'El nombre debe tener al menos 2 caracteres');
            return false;
        }
        
        if (!regex.test(valor)) {
            mostrarError('nombre', 'Solo se permiten letras y espacios');
            return false;
        }
        
        limpiarError('nombre');
        return true;
    }
    
    // Validar email
    function validarEmail() {
        const valor = campos.email.value.trim();
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        if (!valor) {
            mostrarError('email', 'El correo electrónico es obligatorio');
            return false;
        }
        
        if (!regex.test(valor)) {
            mostrarError('email', 'Ingrese un correo electrónico válido');
            return false;
        }
        
        limpiarError('email');
        return true;
    }
    
    // Validar teléfono (exactamente 10 dígitos)
    function validarTelefono() {
        const valor = campos.telefono.value.trim();
        const regex = /^\d{10}$/;
        
        if (!valor) {
            mostrarError('telefono', 'El teléfono es obligatorio');
            return false;
        }
        
        if (!regex.test(valor)) {
            mostrarError('telefono', 'Debe contener exactamente 10 dígitos');
            return false;
        }
        
        limpiarError('telefono');
        return true;
    }
    
    // Validar fecha de nacimiento
    function validarFecha() {
        const valor = campos.fechaNacimiento.value;
        
        if (!valor) {
            mostrarError('fecha', 'La fecha de nacimiento es obligatoria');
            return false;
        }
        
        const fechaNacimiento = new Date(valor);
        const hoy = new Date();
        const edad = hoy.getFullYear() - fechaNacimiento.getFullYear();
        
        if (fechaNacimiento > hoy) {
            mostrarError('fecha', 'La fecha no puede ser futura');
            return false;
        }
        
        if (edad < 10 || edad > 120) {
            mostrarError('fecha', 'La edad debe estar entre 10 y 120 años');
            return false;
        }
        
        limpiarError('fecha');
        return true;
    }
    
    // Validar formulario completo
    function validarFormulario() {
        const valido = 
            validarNombre() &&
            validarEmail() &&
            validarTelefono() &&
            validarFecha();
        
        return valido;
    }
    
    // ===== FUNCIONES DE UI =====
    
    function mostrarError(campo, mensaje) {
        if (campos[campo]) {
            campos[campo].classList.add('invalido');
            campos[campo].classList.remove('valido');
        }
        if (errores[campo]) {
            errores[campo].textContent = mensaje;
            errores[campo].classList.add('mostrar');
        }
    }
    
    function limpiarError(campo) {
        if (campos[campo]) {
            campos[campo].classList.remove('invalido');
            campos[campo].classList.add('valido');
        }
        if (errores[campo]) {
            errores[campo].classList.remove('mostrar');
            errores[campo].textContent = '';
        }
    }
    
    function mostrarFeedback(mensaje, tipo) {
        feedbackContainer.textContent = mensaje;
        feedbackContainer.className = `feedback-container feedback-${tipo}`;
        feedbackContainer.style.display = 'block';
        
        // Scroll a la vista del feedback
        feedbackContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        
        // Auto-ocultar después de 5 segundos si es éxito
        if (tipo === 'exito') {
            setTimeout(() => {
                feedbackContainer.style.display = 'none';
            }, 5000);
        }
    }
    
    function mostrarCargando(mostrar) {
        if (mostrar) {
            btnGuardar.disabled = true;
            btnGuardar.innerHTML = 'Guardando...';
        } else {
            btnGuardar.disabled = false;
            btnGuardar.innerHTML = 'Guardar Usuario';
        }
    }
    
    // ===== FUNCIONES DE API =====
    
    async function guardarUsuario() {
        try {
            mostrarCargando(true);
            
            const usuario = {
                nombre: campos.nombre.value.trim(),
                email: campos.email.value.trim(),
                telefono: campos.telefono.value.trim(),
                fechaNacimiento: campos.fechaNacimiento.value
            };
            
            const response = await fetch(API_BASE_URL + '&metodo=crear', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(usuario)
            });
            
            const resultado = await response.json();
            
            if (response.ok && resultado.status === 'ok') {
    mostrarFeedback('¡Usuario registrado exitosamente!', 'exito');
    limpiarFormulario();
}
 else {
                mostrarFeedback('Error al guardar el usuario. Intente nuevamente.', 'error');
            }
            
        } catch (error) {
            console.error('Error:', error);
            mostrarFeedback('Error de conexión. Verifique su internet.', 'error');
        } finally {
            mostrarCargando(false);
        }
    }
    
    function limpiarFormulario() {
        Object.values(campos).forEach(campo => {
            if (campo) {
                campo.value = '';
                campo.classList.remove('invalido', 'valido');
            }
        });
        
        Object.values(errores).forEach(error => {
            if (error) {
                error.classList.remove('mostrar');
                error.textContent = '';
            }
        });
        
        actualizarContadores();
    }
    
    // ===== FUNCIONES UTILITARIAS =====
    
    function actualizarContadores() {
        if (contadores.nombre) {
            contadores.nombre.textContent = `${campos.nombre.value.length}/70`;
        }
        if (contadores.email) {
            contadores.email.textContent = `${campos.email.value.length}/100`;
        }
        if (contadores.telefono) {
            contadores.telefono.textContent = `${campos.telefono.value.length}/10`;
        }
    }
    
    function soloLetras(event) {
        // Permitir teclas de control
        if (event.ctrlKey || event.altKey || event.metaKey) return true;
        
        const key = event.key;
        
        // Permitir teclas de control
        if (key === 'Backspace' || key === 'Tab' || key === 'Enter' || 
            key === 'Delete' || key === 'ArrowLeft' || key === 'ArrowRight' ||
            key === 'Home' || key === 'End' || key === ' ') {
            return true;
        }
        
        // Solo permitir letras, acentos y espacios
        const regex = /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]$/;
        if (!regex.test(key)) {
            event.preventDefault();
            return false;
        }
        return true;
    }
    
    function soloNumeros(event) {
        // Permitir teclas de control
        if (event.ctrlKey || event.altKey || event.metaKey) return true;
        
        const key = event.key;
        
        // Permitir teclas de control
        if (key === 'Backspace' || key === 'Tab' || key === 'Enter' || 
            key === 'Delete' || key === 'ArrowLeft' || key === 'ArrowRight' ||
            key === 'Home' || key === 'End') {
            return true;
        }
        
        // Solo permitir números
        const regex = /^[0-9]$/;
        if (!regex.test(key)) {
            event.preventDefault();
            return false;
        }
        return true;
    }
    
    function limpiarNoLetras(event) {
        const input = event.target;
        // Remover cualquier carácter que no sea letra, espacio o acento
        input.value = input.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '');
        actualizarContadores();
        validarNombre();
    }
    
    function limpiarNoNumeros(event) {
        const input = event.target;
        // Remover cualquier carácter que no sea número
        input.value = input.value.replace(/[^0-9]/g, '');
        actualizarContadores();
        validarTelefono();
    }
    
    // ===== EVENT LISTENERS =====
    
    document.addEventListener('DOMContentLoaded', function() {
        // Establecer fecha máxima (hoy)
        const hoy = new Date().toISOString().split('T')[0];
        campos.fechaNacimiento.max = hoy;
        
        // Inicializar contadores
        actualizarContadores();
        
        // Eventos para contadores
        campos.nombre.addEventListener('input', limpiarNoLetras);
        campos.email.addEventListener('input', function() {
            actualizarContadores();
            validarEmail();
        });
        campos.telefono.addEventListener('input', limpiarNoNumeros);
        
        // Validación en tiempo real
        campos.nombre.addEventListener('blur', validarNombre);
        campos.email.addEventListener('blur', validarEmail);
        campos.telefono.addEventListener('blur', validarTelefono);
        campos.fechaNacimiento.addEventListener('change', validarFecha);
        campos.fechaNacimiento.addEventListener('blur', validarFecha);
        
        // Restricciones de entrada
        campos.nombre.addEventListener('keydown', soloLetras);
        campos.telefono.addEventListener('keydown', soloNumeros);
        
        // Prevenir pegado de contenido no válido
        campos.nombre.addEventListener('paste', function(e) {
            e.preventDefault();
            const textoPegado = (e.clipboardData || window.clipboardData).getData('text');
            const textoFiltrado = textoPegado.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '');
            document.execCommand('insertText', false, textoFiltrado);
            actualizarContadores();
            validarNombre();
        });
        
        campos.telefono.addEventListener('paste', function(e) {
            e.preventDefault();
            const textoPegado = (e.clipboardData || window.clipboardData).getData('text');
            const textoFiltrado = textoPegado.replace(/[^0-9]/g, '');
            document.execCommand('insertText', false, textoFiltrado);
            actualizarContadores();
            validarTelefono();
        });
        
        // Envío del formulario
        formulario.addEventListener('submit', function(event) {
            event.preventDefault();
            
            if (validarFormulario()) {
                guardarUsuario();
            } else {
                mostrarFeedback('Por favor, corrija los errores en el formulario.', 'error');
            }
        });
    });
</script>

</body>
</html>
