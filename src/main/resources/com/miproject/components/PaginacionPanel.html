<html xmlns:wicket="http://wicket.apache.org">
<head>
    <wicket:head>
        <style>
            /* ===== ESTILOS DEL PANEL DE PAGINACIÓN ===== */
            .pagination-container {
                margin-top: 30px;
                padding-top: 20px;
                border-top: 1px solid var(--lavanda, #d0b8eb);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
                font-family: inherit;
            }

            .page-info {
                background: var(--fondo-suave, #f9f7ff);
                padding: 8px 18px;
                border-radius: 30px;
                font-size: 13px;
                font-weight: 500;
                color: var(--morado-medio, #725ec3);
                letter-spacing: 0.3px;
                text-align: center;
            }

            .page-info i {
                margin-right: 8px;
                color: var(--morado-oscuro, #4332af);
            }

            .pagination-controls {
                display: flex;
                gap: 8px;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
            }

            .pages-wrapper {
                display: flex;
                gap: 6px;
                align-items: center;
            }

            /* CLASE BASE PARA TODOS LOS BOTONES */
            .btn-pagination {
                display: inline-flex !important;
                align-items: center !important;
                justify-content: center !important;
                background: var(--fondo-suave, #f9f7ff) !important;
                color: var(--morado-oscuro, #4332af) !important;
                text-decoration: none !important;
                transition: all 0.2s ease !important;
                cursor: pointer !important;
                font-weight: 500 !important;
                font-size: 14px !important;
                border: 1px solid transparent !important;
                outline: none !important;
                box-shadow: none !important;
            }

            /* Estilo específico para los botones con texto (Anterior / Siguiente) */
            .btn-texto {
                padding: 0 16px !important;
                height: 40px !important;
                border-radius: 20px !important; /* Forma de píldora */
                gap: 8px !important;
            }

            /* Estilo específico para los NÚMEROS (Cuadrados redondeados / simétricos) */
            .btn-numero {
                min-width: 40px !important;
                height: 40px !important;
                padding: 0 10px !important;
                border-radius: 8px !important; /* Forma de botón cuadrado */
            }

            /* HOVER GLOBAL (No aplica si está activo o deshabilitado) */
            .btn-pagination:hover:not(.active-page):not([disabled]) {
                background: var(--lavanda, #d0b8eb) !important;
                border-color: var(--morado-claro, #a18bd7) !important;
                transform: translateY(-1px) !important;
                color: var(--morado-oscuro, #4332af) !important;
            }

            /* PÁGINA ACTIVA (Resaltada) */
            .btn-pagination.active-page {
                background: var(--morado-oscuro, #4332af) !important;
                color: white !important;
                border-color: var(--morado-oscuro, #4332af) !important;
                font-weight: 600 !important;
                box-shadow: 0 4px 10px rgba(67, 50, 175, 0.25) !important;
                cursor: default !important;
                pointer-events: none !important;
            }

            /* BOTONES DESHABILITADOS (Wicket añade el atributo 'disabled' automáticamente) */
            .btn-pagination[disabled] {
                opacity: 0.4 !important;
                cursor: not-allowed !important;
                pointer-events: none !important;
                background: #f1f3f5 !important;
                color: #adb5bd !important;
                border-color: transparent !important;
            }

            .btn-pagination span,
            .btn-pagination i {
                color: inherit !important;
                text-decoration: none !important;
            }
        </style>
    </wicket:head>
</head>
<body>
    <wicket:panel>
        <div class="pagination-container">
            
            <div class="page-info">
                <i class="fas fa-info-circle"></i> 
                <span wicket:id="infoPagina">Mostrando 1 a 5 de 25 registros</span>
            </div>

            <div class="pagination-controls">

                <a wicket:id="btnAnterior" class="btn-pagination btn-texto">
                    <i class="fas fa-chevron-left"></i> Anterior
                </a>

                <div class="pages-wrapper">
                    <wicket:container wicket:id="paginas">
                        <a wicket:id="linkPagina" class="btn-pagination btn-numero">
                            <span wicket:id="numero">1</span>
                        </a>
                    </wicket:container>
                </div>

                <a wicket:id="btnSiguiente" class="btn-pagination btn-texto">
                    Siguiente <i class="fas fa-chevron-right"></i>
                </a>

            </div>

        </div>
    </wicket:panel>
</body>
</html>
