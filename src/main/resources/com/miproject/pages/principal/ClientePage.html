<wicket:extend>
    <wicket:head>
        <style>
            :root {
                --morado-oscuro: #4332af;
                --morado-medio: #725ec3;
                --morado-claro: #a18bd7;
                --lavanda: #d0b8eb;
                --fondo-suave: #f9f7ff;
                --blanco: #ffffff;
                --error: #e74c3c;
                --exito: #2ecc71;
                --sombra: rgba(0, 0, 0, 0.08);
            }

            .content-wrapper {
                background: var(--blanco);
                padding: 30px;
                border-radius: 20px;
                box-shadow: 0 5px 20px var(--sombra);
                border: 1px solid var(--lavanda);
            }

            .header-section {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 25px;
                flex-wrap: wrap;
                gap: 15px;
            }

            .page-title {
                color: var(--morado-oscuro);
                margin: 0;
                font-size: 24px;
                font-weight: 600;
            }

            /* Estilo del Buscador */
            .search-box {
                position: relative;
                flex: 1;
                min-width: 250px;
                max-width: 400px;
            }

            .search-box input {
                width: 100%;
                padding: 10px 15px 10px 40px;
                border: 2px solid var(--lavanda);
                border-radius: 12px;
                outline: none;
                transition: all 0.3s;
            }

            .search-box input:focus {
                border-color: var(--morado-medio);
                box-shadow: 0 0 0 3px var(--fondo-suave);
            }

            .search-box i {
                position: absolute;
                left: 15px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--morado-claro);
            }

            /* Botón Nuevo */
            .btn-nuevo {
                background: var(--morado-oscuro);
                color: white !important;
                padding: 10px 20px;
                border-radius: 12px;
                text-decoration: none;
                font-weight: 600;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                transition: all 0.3s;
            }

            .btn-nuevo:hover {
                background: var(--morado-medio);
                transform: translateY(-2px);
            }

            /* Tabla */
            .table-container {
                overflow-x: auto;
                margin-top: 10px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 14px;
            }

            thead {
                background: var(--fondo-suave);
                color: var(--morado-oscuro);
            }

            th {
                padding: 15px;
                text-align: left;
                font-weight: 600;
                border-bottom: 2px solid var(--lavanda);
            }

            td {
                padding: 12px 15px;
                border-bottom: 1px solid #eee;
                color: #555;
            }

            tr:hover {
                background-color: #fcfaff;
            }

            /* BADGES CON LETRAS DE COLOR Y FONDO CLARITO */
            .badge {
                display: inline-block;
                padding: 6px 14px;
                border-radius: 20px;
                font-size: 12px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                text-align: center;
                min-width: 80px;
            }

            .badge-activo { 
                background: #d4fce4;  /* Fondo verde clarito */
                color: #0a8f3c;      /* Letra verde oscuro pero vibrante */
            }

            .badge-inactivo { 
                background: #ffe0dd;  /* Fondo rojo clarito */
                color: #c0392b;       /* Letra roja */
            }

            .action-links {
                display: flex;
                gap: 10px;
            }

            .btn-action {
                width: 32px;
                height: 32px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 8px;
                transition: all 0.2s;
                text-decoration: none;
            }

            .edit { background: var(--fondo-suave); color: var(--morado-medio); }
            .edit:hover { background: var(--morado-medio); color: white; }

            .delete { background: #fff5f5; color: var(--error); }
            .delete:hover { background: var(--error); color: white; }

            .no-permiso {
                text-align: center;
                padding: 50px;
                color: var(--error);
                background: #fff5f5;
                border-radius: 15px;
            }

            .total-info {
                margin-top: 0;
                font-size: 13px;
                color: var(--morado-claro);
                font-style: italic;
                background: var(--fondo-suave);
                padding: 8px 16px;
                border-radius: 20px;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }
            
            .total-info strong {
                color: var(--morado-oscuro);
                font-weight: 700;
            }

            /* CONTENEDOR DEL PAGINADO CENTRADO */
            .pagination-container {
                margin-top: 30px;
                padding-top: 20px;
                border-top: 1px solid var(--lavanda);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 15px;
            }
            
            .page-info {
                background: var(--fondo-suave);
                padding: 8px 18px;
                border-radius: 30px;
                font-size: 13px;
                font-weight: 500;
                color: var(--morado-medio);
                letter-spacing: 0.3px;
                text-align: center;
            }
            
            .page-info span {
                font-weight: 600;
                color: var(--morado-oscuro);
            }
            
            .pagination-controls {
                display: flex;
                gap: 12px;
                justify-content: center;
            }
            
            .btn-pagination {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 8px 20px;
                background: var(--fondo-suave);
                color: var(--morado-oscuro);
                border-radius: 30px;
                text-decoration: none;
                transition: all 0.2s;
                cursor: pointer;
                font-weight: 500;
                font-size: 13px;
                border: 1px solid transparent;
            }

            .btn-pagination:hover {
                background: var(--lavanda);
                border-color: var(--morado-claro);
                transform: translateY(-1px);
            }

            /* Botones deshabilitados */
            .btn-pagination[disabled] {
                opacity: 0.4;
                cursor: not-allowed;
                pointer-events: none;
                background: #e9ecef;
                color: #6c757d;
            }
            
            div[wicket\:id="feedback"] ul {
                list-style-type: none;
                padding: 0;
                margin: 0 0 20px 0;
            }

            div[wicket\:id="feedback"] li {
                padding: 12px 20px;
                margin-bottom: 10px;
                border-radius: 12px;
                font-weight: 600;
                font-size: 14px;
            }

            .feedbackPanelSUCCESS {
                background-color: #e8f8f0;
                color: var(--exito);
                border: 1px solid var(--exito);
            }

            .feedbackPanelERROR {
                background-color: #fdf2f2;
                color: var(--error);
                border: 1px solid var(--error);
            }

            .feedbackPanelINFO {
                background-color: var(--fondo-suave);
                color: var(--morado-oscuro);
                border: 1px solid var(--lavanda);
            }
        </style>
    </wicket:head>

   <div class="content-wrapper">
        <div class="header-section">
            <h1 class="page-title" wicket:id="titulo">Gestión de Clientes</h1>
            <a wicket:id="nuevoCliente" class="btn-nuevo">
                <i class="fas fa-plus"></i> Nuevo Cliente
            </a>
        </div>

        <div wicket:id="feedback"></div>

        <div wicket:id="mensajeSinPermiso" class="no-permiso">
            No tienes permiso para ver esta página.
        </div>

        <div wicket:id="tablaContainer">
            
            <form wicket:id="busquedaForm" class="header-section">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" wicket:id="busqueda" placeholder="Buscar por nombre, código o empresa...">
                </div>
                <div class="total-info">
                    <i class="fas fa-chart-line"></i> Resultados encontrados: <strong wicket:id="totalResultados">0</strong>
                </div>
            </form>

            <div wicket:id="contenedorTabla">
                <div class="table-container" wicket:id="tableWrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nombre</th>
                                <th>Teléfono</th>
                                <th>Empresa</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr wicket:id="clienteList">
                                <td wicket:id="codigo"></td>
                                <td wicket:id="nombre"></td>
                                <td wicket:id="telefono"></td>
                                <td wicket:id="empresa"></td>
                                <td>
                                    <span wicket:id="estado">
                                        <span wicket:id="estadoTexto"></span>
                                    </span>
                                </td>
                                <td class="action-links">
                                    <a wicket:id="editarCliente" class="btn-action edit" title="Editar">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a wicket:id="eliminarCliente" class="btn-action delete" title="Eliminar">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination-container">
                    <div class="page-info">
                        <i class="fas fa-info-circle"></i> <span wicket:id="infoPagina"></span>
                    </div>
                    <div class="pagination-controls">
                        <a wicket:id="btnAnterior" class="btn-pagination">
                            <i class="fas fa-chevron-left"></i> Anterior
                        </a>
                        <a wicket:id="btnSiguiente" class="btn-pagination">
                            Siguiente <i class="fas fa-chevron-right"></i>
                        </a>
                    </div>
                </div>
            </div> 
        </div> 
    </div>
</wicket:extend>
