<wicket:extend>
    <wicket:head>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <style>
            :root {
                --morado-oscuro: #4332af;
                --morado-medio: #725ec3;
                --morado-claro: #a18bd7;
                --lavanda: #d0b8eb;
                --fondo-suave: #f9f7ff;
                --blanco: #ffffff;
                --error: #e74c3c;
                --exito: #2ecc71;
                --sombra: rgba(0, 0, 0, 0.08);
            }

            .page-container {
                max-width: 650px;
                margin: 0 auto;
                padding: 20px;
            }

            .content-card {
                background: var(--blanco);
                padding: 40px;
                border-radius: 20px;
                box-shadow: 0 10px 30px var(--sombra);
                border: 1px solid var(--lavanda);
            }

            .page-title {
                color: var(--morado-oscuro);
                margin-bottom: 30px;
                font-size: 26px;
                font-weight: 700;
                text-align: center;
                border-bottom: 2px solid var(--fondo-suave);
                padding-bottom: 15px;
            }

            .form-group {
                margin-bottom: 25px;
            }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                font-weight: 600;
                color: #555;
                font-size: 14px;
            }

            .input-container {
                position: relative;
            }

            .input-container i {
                position: absolute;
                left: 15px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--morado-claro);
                z-index: 5;
            }

            input[type="text"] {
                width: 100%;
                padding: 12px 15px 12px 45px;
                border: 2px solid var(--lavanda);
                border-radius: 12px;
                font-size: 15px;
                transition: all 0.3s ease;
                box-sizing: border-box;
            }

            input[type="text"]:focus {
                outline: none;
                border-color: var(--morado-medio);
                box-shadow: 0 0 0 4px var(--fondo-suave);
            }

            .checkbox-group {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 15px;
                background: var(--fondo-suave);
                border-radius: 12px;
                margin-top: 8px;
            }

            .checkbox-group input[type="checkbox"] {
                width: 20px;
                height: 20px;
                cursor: pointer;
                accent-color: var(--morado-medio);
            }

            .checkbox-group label {
                margin: 0;
                font-weight: 600;
                color: var(--morado-oscuro);
                cursor: pointer;
            }

            .info-ayuda {
                font-size: 13px;
                color: var(--morado-claro);
                margin-top: 8px;
                padding-left: 5px;
                display: flex;
                align-items: center;
                gap: 5px;
            }

            .info-ayuda i {
                font-size: 12px;
            }

            .mensaje-error {
                background: #fdf2f2;
                color: var(--error);
                padding: 15px;
                border-radius: 12px;
                margin-bottom: 20px;
                border-left: 5px solid var(--error);
                font-size: 14px;
                font-weight: 500;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .mensaje-error i {
                font-size: 18px;
            }

            .btn-group {
                display: flex;
                gap: 15px;
                margin-top: 35px;
                padding-top: 20px;
                border-top: 1px solid var(--fondo-suave);
            }

            .btn-guardar {
                flex: 2;
                background: var(--morado-oscuro);
                color: white;
                border: none;
                padding: 15px;
                border-radius: 12px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
            }

            .btn-guardar:hover {
                background: var(--morado-medio);
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(67, 50, 175, 0.3);
            }

            .btn-cancelar {
                flex: 1;
                background: var(--fondo-suave);
                color: var(--morado-oscuro);
                text-decoration: none;
                padding: 15px;
                border-radius: 12px;
                text-align: center;
                font-weight: 600;
                border: 1px solid var(--lavanda);
                transition: all 0.3s;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
            }

            .btn-cancelar:hover {
                background: var(--lavanda);
                color: white;
            }

            .required-mark {
                color: var(--error);
                margin-left: 3px;
            }

            @media (max-width: 600px) {
                .content-card {
                    padding: 25px;
                }
                
                .btn-group {
                    flex-direction: column;
                }
            }
        </style>
    </wicket:head>

    <div class="page-container">
        <div class="content-card">
            <h1 class="page-title" wicket:id="titulo">Crear Nuevo Perfil</h1>

            <form wicket:id="formulario">
                <div class="form-group">
                    <label>Nombre del Perfil <span class="required-mark">*</span></label>
                    <div class="input-container">
                        <i class="fas fa-tag"></i>
                        <input type="text" wicket:id="nombre" placeholder="Ej: Administrador, Editor, Consultor">
                    </div>
                    <div class="info-ayuda">
                        <i class="fas fa-info-circle"></i>
                        <span>Máximo 30 caracteres. Solo letras, números, espacios y guiones.</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" wicket:id="administrador">
                        <label>
                            <i class="fas fa-crown" style="margin-right: 8px; color: #f39c12;"></i>
                            ¿Es administrador?
                        </label>
                    </div>
                    <div class="info-ayuda">
                        <i class="fas fa-shield-alt"></i>
                        <span>Los administradores tienen acceso completo al sistema sin restricciones.</span>
                    </div>
                </div>

                <div wicket:id="mensajeError" class="mensaje-error">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>Mensaje de error aquí</span>
                </div>

                <div class="btn-group">
                    <button type="submit" wicket:id="btnGuardar" class="btn-guardar">
                        <i class="fas fa-save"></i> Guardar Perfil
                    </button>
                    <a href="#" wicket:id="cancelar" class="btn-cancelar">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</wicket:extend>
