<wicket:extend>
    <wicket:head>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <style>
            :root {
                --morado-oscuro: #4332af;
                --morado-medio: #725ec3;
                --morado-claro: #a18bd7;
                --lavanda: #d0b8eb;
                --fondo-suave: #f9f7ff;
                --blanco: #ffffff;
                --error: #e74c3c;
                --exito: #2ecc71;
                --sombra: rgba(0, 0, 0, 0.08);
            }

            .page {
                max-width: 600px;
                margin: 0 auto;
                padding: 20px;
            }

            .content {
                background: var(--blanco);
                padding: 40px;
                border-radius: 20px;
                box-shadow: 0 10px 30px var(--sombra);
                border: 1px solid var(--lavanda);
                text-align: center;
            }

            .warning-icon {
                font-size: 56px;
                color: #f39c12;
                margin-bottom: 20px;
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.05); }
                100% { transform: scale(1); }
            }

            .page-title {
                color: var(--error);
                margin-top: 0;
                margin-bottom: 20px;
                font-size: 28px;
                font-weight: 700;
                border-bottom: 2px solid var(--fondo-suave);
                padding-bottom: 15px;
            }

            p {
                color: #666;
                font-size: 16px;
                margin-bottom: 25px;
            }

            .info-perfil {
                background: var(--fondo-suave);
                padding: 20px;
                border-radius: 15px;
                margin: 25px 0;
                text-align: left;
                border: 1px solid var(--lavanda);
            }

            .info-row {
                display: flex;
                justify-content: space-between;
                padding: 12px 0;
                border-bottom: 1px solid var(--lavanda);
            }

            .info-row:last-child {
                border-bottom: none;
            }

            .info-label {
                font-weight: 600;
                color: var(--morado-oscuro);
                font-size: 14px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .info-value {
                color: #333;
                font-weight: 500;
                font-size: 15px;
            }

            .mensaje-advertencia {
                background: #fff3cd;
                border-left: 5px solid #f39c12;
                padding: 15px;
                border-radius: 12px;
                margin: 20px 0;
                color: #856404;
                text-align: left;
                font-size: 14px;
                display: flex;
                align-items: center;
                gap: 10px;
                font-weight: 500;
            }

            .mensaje-advertencia i {
                font-size: 18px;
                color: #f39c12;
            }

            .btn-group {
                display: flex;
                gap: 15px;
                margin-top: 30px;
                padding-top: 20px;
                border-top: 1px solid var(--fondo-suave);
            }

            .btn-confirmar {
                background: var(--error);
                color: white;
                border: none;
                flex: 1;
                padding: 15px;
                border-radius: 12px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
            }

            .btn-confirmar:hover {
                background: #c0392b;
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
            }

            .btn-cancelar {
                background: var(--fondo-suave);
                color: var(--morado-oscuro);
                border: 1px solid var(--lavanda);
                flex: 1;
                padding: 15px;
                border-radius: 12px;
                text-decoration: none;
                text-align: center;
                font-weight: 600;
                transition: all 0.3s;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
            }

            .btn-cancelar:hover {
                background: var(--lavanda);
                color: white;
            }

            .feedback-panel {
                margin-top: 20px;
                padding: 15px;
                border-radius: 12px;
                list-style: none;
            }

            div[wicket\:id="feedback"] ul {
                list-style-type: none;
                padding: 0;
                margin: 0;
            }

            div[wicket\:id="feedback"] li {
                padding: 12px 20px;
                margin-bottom: 10px;
                border-radius: 12px;
                font-weight: 600;
                font-size: 14px;
            }

            .feedbackPanelSUCCESS {
                background-color: #e8f8f0;
                color: var(--exito);
                border: 1px solid var(--exito);
            }

            .feedbackPanelERROR {
                background-color: #fdf2f2;
                color: var(--error);
                border: 1px solid var(--error);
            }

            .feedbackPanelINFO {
                background-color: var(--fondo-suave);
                color: var(--morado-oscuro);
                border: 1px solid var(--lavanda);
            }

            @media (max-width: 600px) {
                .content {
                    padding: 25px;
                }
                
                .btn-group {
                    flex-direction: column;
                }
                
                .info-row {
                    flex-direction: column;
                    gap: 5px;
                }
            }
        </style>
    </wicket:head>

    <div class="page">
        <div class="content">
            <div class="warning-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            
            <h1 class="page-title" wicket:id="titulo">Eliminar Perfil</h1>
            
            <p>¿Está seguro de que desea eliminar permanentemente este perfil?</p>
            
            <div class="info-perfil">
                <div class="info-row">
                    <span class="info-label">
                        <i class="fas fa-tag" style="margin-right: 8px; color: var(--morado-claro);"></i>
                        Nombre:
                    </span>
                    <span class="info-value" wicket:id="nombrePerfil"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">
                        <i class="fas fa-user-tag" style="margin-right: 8px; color: var(--morado-claro);"></i>
                        Rol:
                    </span>
                    <span class="info-value" wicket:id="rolPerfil"></span>
                </div>
            </div>

            <div wicket:id="mensajeAdvertencia" class="mensaje-advertencia">
                <i class="fas fa-exclamation-circle"></i>
                <span>Mensaje de advertencia aquí</span>
            </div>

            <div class="btn-group">
                <button wicket:id="confirmar" class="btn-confirmar">
                    <i class="fas fa-trash-alt"></i> Sí, eliminar
                </button>
                <a wicket:id="cancelar" class="btn-cancelar">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>

            <div wicket:id="feedback" class="feedback-panel"></div>
        </div>
    </div>
</wicket:extend>
