<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">

<body>
    <wicket:extend>

        <wicket:head>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
            <style>
                :root {
                    --morado-oscuro: #4332af;
                    --morado-medio: #725ec3;
                    --morado-claro: #a18bd7;
                    --lavanda: #d0b8eb;
                    --fondo-suave: #f9f7ff;
                    --blanco: #ffffff;
                    --error: #e74c3c;
                    --exito: #2ecc71;
                    --sombra: rgba(0, 0, 0, 0.08);
                }

                .page {
                    max-width: 1200px;
                    margin: 0 auto;
                    padding: 20px;
                }

                .content {
                    background: var(--blanco);
                    padding: 30px;
                    border-radius: 20px;
                    box-shadow: 0 5px 20px var(--sombra);
                    border: 1px solid var(--lavanda);
                }

                .page-title {
                    color: var(--morado-oscuro);
                    margin: 0 0 25px 0;
                    font-size: 24px;
                    font-weight: 600;
                    padding-bottom: 15px;
                    border-bottom: 2px solid var(--fondo-suave);
                }

                .barra-acciones {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 25px;
                    margin-top: 10px;
                    flex-wrap: wrap;
                    gap: 15px;
                }

                .search-box {
                    position: relative;
                    flex: 1;
                    min-width: 250px;
                    max-width: 400px;
                }

                .search-box input {
                    width: 100%;
                    padding: 10px 15px 10px 40px;
                    border: 2px solid var(--lavanda);
                    border-radius: 12px;
                    outline: none;
                    transition: all 0.3s;
                    font-size: 14px;
                }

                .search-box input:focus {
                    border-color: var(--morado-medio);
                    box-shadow: 0 0 0 3px var(--fondo-suave);
                }

                .search-box i {
                    position: absolute;
                    left: 15px;
                    top: 50%;
                    transform: translateY(-50%);
                    color: var(--morado-claro);
                    pointer-events: none;
                }

                .btn-nuevo {
                    background: var(--morado-oscuro);
                    color: white !important;
                    padding: 10px 20px;
                    border-radius: 12px;
                    text-decoration: none;
                    font-weight: 600;
                    display: inline-flex;
                    align-items: center;
                    gap: 8px;
                    transition: all 0.3s;
                }

                .btn-nuevo:hover {
                    background: var(--morado-medio);
                    transform: translateY(-2px);
                }

                .tabla-container {
                    overflow-x: auto;
                    margin-top: 10px;
                    margin-bottom: 25px;
                }

                table {
                    width: 100%;
                    border-collapse: collapse;
                    font-size: 14px;
                }

                thead {
                    background: var(--fondo-suave);
                    color: var(--morado-oscuro);
                }

                th {
                    padding: 15px;
                    text-align: left;
                    font-weight: 600;
                    border-bottom: 2px solid var(--lavanda);
                }

                td {
                    padding: 12px 15px;
                    border-bottom: 1px solid #eee;
                    color: #555;
                    vertical-align: middle;
                }

                tr:hover {
                    background-color: #fcfaff;
                }

                .badge {
                    display: inline-block;
                    padding: 6px 14px;
                    border-radius: 20px;
                    font-size: 12px;
                    font-weight: 700;
                    text-transform: uppercase;
                    letter-spacing: 0.5px;
                    text-align: center;
                }

                .badge-admin {
                    background: #d4fce4;
                    color: #0a8f3c;
                }

                .badge-usuario {
                    background: var(--fondo-suave);
                    color: var(--morado-medio);
                }

                .acciones-cell {
                    white-space: nowrap;
                }

                .acciones-cell a {
                    text-decoration: none;
                    margin-right: 15px;
                    font-size: 18px;
                    transition: all 0.2s ease;
                }

                .icono-editar {
                    color: var(--morado-medio);
                }

                .icono-editar:hover {
                    color: var(--morado-oscuro);
                }

                .icono-eliminar {
                    color: var(--error);
                }

                .icono-eliminar:hover {
                    color: #c0392b;
                }

                .mensaje-sin-permiso {
                    text-align: center;
                    padding: 50px;
                    color: var(--error);
                    background: #fff5f5;
                    border-radius: 15px;
                    margin-bottom: 20px;
                }

                .feedback-exito {
                    margin-bottom: 20px;
                }

                .feedback-exito ul {
                    list-style: none;
                    padding: 12px 20px;
                    margin: 0;
                    background-color: #e8f8f0;
                    color: var(--exito);
                    border: 1px solid var(--exito);
                    border-radius: 12px;
                    border-left: 5px solid var(--exito);
                    font-weight: 500;
                }

                .feedback-exito ul li {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                }

                .feedback-exito ul li::before {
                    content: "\f00c";
                    font-family: "Font Awesome 6 Free";
                    font-weight: 900;
                }

                .feedback-exito:empty {
                    display: none;
                }

                div[wicket\:id="feedback"] ul {
                    list-style-type: none;
                    padding: 0;
                    margin: 0;
                }
            </style>
        </wicket:head>

        <div class="page">
            <div class="content">
                <h1 class="page-title" wicket:id="titulo">Gestión de Perfiles</h1>

                <div wicket:id="feedback" class="feedback-exito"></div>

                <div class="barra-acciones">
                    <div class="search-box">
                        <form wicket:id="busquedaForm">
                            <i class="fas fa-search"></i>
                            <input type="text" wicket:id="busqueda" placeholder="Buscar por nombre de perfil...">
                        </form>
                    </div>
                    <a wicket:id="nuevoPerfil" class="btn-nuevo">
                        <i class="fas fa-plus"></i> Nuevo Perfil
                    </a>
                </div>

                <div class="tabla-container" wicket:id="tablaContainer">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre del Perfil</th>
                                <th>Rol</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr wicket:id="perfilList">
                                <td wicket:id="nombrePerfil"></td>
                                <td>
                                    <span wicket:id="rol" class="badge"></span>
                                </td>
                                <td class="acciones-cell">
                                    <a wicket:id="editarPerfil" class="icono-editar"><i class="fas fa-edit"></i></a>
                                    <a wicket:id="eliminarPerfil" class="icono-eliminar"><i class="fas fa-trash-alt"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div wicket:id="paginacionContainer"></div>
            </div>

            <div wicket:id="mensajeSinPermiso" class="mensaje-sin-permiso">
                <i class="fas fa-lock" style="font-size: 48px; margin-bottom: 15px; display: block;"></i>
                No tienes permiso para ver esta página.
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                // Aplicar badges a los roles
                document.querySelectorAll('[wicket\\:id="rol"]').forEach(function (element) {
                    const rol = element.textContent.trim();
                    element.classList.add('badge');
                    if (rol === 'ADMINISTRADOR') {
                        element.classList.add('badge-admin');
                    } else {
                        element.classList.add('badge-usuario');
                    }
                });
            });
        </script>
    </wicket:extend>
</body>

</html>
