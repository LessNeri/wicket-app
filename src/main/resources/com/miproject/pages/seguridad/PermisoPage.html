<wicket:extend>
    <wicket:head>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <style>
            :root {
                --morado-oscuro: #4332af;
                --morado-medio: #725ec3;
                --morado-claro: #a18bd7;
                --lavanda: #d0b8eb;
                --fondo-suave: #f9f7ff;
                --blanco: #ffffff;
                --error: #e74c3c;
                --exito: #2ecc71;
                --sombra: rgba(0, 0, 0, 0.08);
            }

            .page {
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px;
            }

            .content {
                background: var(--blanco);
                padding: 30px;
                border-radius: 20px;
                box-shadow: 0 5px 20px var(--sombra);
                border: 1px solid var(--lavanda);
            }

            .page-title {
                color: var(--morado-oscuro);
                margin: 0 0 25px 0;
                font-size: 24px;
                font-weight: 600;
                padding-bottom: 15px;
                border-bottom: 2px solid var(--fondo-suave);
            }

            .selector-perfil {
                margin-bottom: 25px;
                display: flex;
                align-items: center;
                gap: 15px;
                flex-wrap: wrap;
                padding: 15px;
                background: var(--fondo-suave);
                border-radius: 12px;
                border: 1px solid var(--lavanda);
            }

            .selector-perfil label {
                font-weight: 600;
                color: var(--morado-oscuro);
                font-size: 14px;
            }

            .selector-perfil select {
                padding: 10px 15px;
                border: 2px solid var(--lavanda);
                border-radius: 10px;
                font-size: 14px;
                background-color: white;
                cursor: pointer;
                min-width: 250px;
            }

            .selector-perfil select:focus {
                outline: none;
                border-color: var(--morado-medio);
                box-shadow: 0 0 0 3px var(--fondo-suave);
            }

            .selector-perfil span {
                color: #856404;
                font-weight: 600;
                margin-left: 10px;
                background-color: #fff3cd;
                padding: 8px 15px;
                border-radius: 20px;
                font-size: 13px;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                border-left: 4px solid #f39c12;
            }

            .selector-perfil span::before {
                content: "\f05a";
                font-family: "Font Awesome 6 Free";
                font-weight: 900;
            }

            .tabla-permisos {
                overflow-x: auto;
                margin-top: 10px;
                margin-bottom: 25px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 14px;
            }

            thead tr {
                border-bottom: 2px solid var(--morado-oscuro);
                text-align: left;
            }

            th {
                padding: 15px 10px;
                text-align: left;
                font-weight: 600;
                color: var(--morado-oscuro);
                background: var(--fondo-suave);
            }

            th:first-child {
                border-radius: 10px 0 0 10px;
            }

            th:last-child {
                border-radius: 0 10px 10px 0;
            }

            .grupo-menu-tr {
                background-color: var(--fondo-suave);
                font-weight: bold;
                border-bottom: 1px solid var(--lavanda);
            }

            .grupo-menu-tr td {
                padding: 12px 10px;
                color: var(--morado-oscuro);
                font-size: 15px;
            }

            .grupo-menu-tr i {
                margin-right: 8px;
                color: var(--morado-medio);
            }

            .modulo-tr {
                border-bottom: 1px solid #eee;
            }

            .modulo-tr:hover {
                background-color: #fcfaff;
            }

            .modulo-tr td {
                padding: 12px 10px;
                color: #555;
            }

            .modulo-tr td:first-child {
                padding-left: 35px;
            }

            input[type="checkbox"] {
                width: 18px;
                height: 18px;
                cursor: pointer;
                accent-color: var(--morado-medio);
            }

            .icono-limpiar {
                cursor: pointer;
                color: var(--error);
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 32px;
                height: 32px;
                border-radius: 8px;
                background: #fff5f5;
                transition: all 0.2s;
            }

            .icono-limpiar:hover {
                background: var(--error);
                color: white;
            }

            .icono-limpiar i {
                font-size: 16px;
            }

            .btn-guardar {
                background: var(--morado-oscuro);
                color: white;
                padding: 12px 25px;
                border: none;
                border-radius: 12px;
                cursor: pointer;
                margin-top: 15px;
                font-size: 15px;
                font-weight: 600;
                transition: all 0.3s;
                display: inline-flex;
                align-items: center;
                gap: 10px;
            }

            .btn-guardar::before {
                content: "\f0c7";
                font-family: "Font Awesome 6 Free";
                font-weight: 900;
            }

            .btn-guardar:hover {
                background: var(--morado-medio);
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(67, 50, 175, 0.3);
            }

            .btn-guardar:disabled {
                background: #ccc;
                cursor: not-allowed;
                transform: none;
                box-shadow: none;
            }

            .btn-guardar:disabled::before {
                opacity: 0.5;
            }

            /* Feedback Panel Estilizado */
            .feedbackPanel {
                list-style: none;
                padding: 0;
                margin: 0 0 25px 0;
            }

            .feedbackPanel li {
                padding: 12px 20px;
                margin-bottom: 10px;
                border-radius: 12px;
                font-weight: 600;
                font-size: 14px;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .feedbackPanel li::before {
                font-family: "Font Awesome 6 Free";
                font-weight: 900;
                font-size: 16px;
            }

            .feedbackPanel li.feedbackPanelSUCCESS {
                color: var(--exito);
                background-color: #e8f8f0;
                border: 1px solid var(--exito);
                border-left: 5px solid var(--exito);
            }

            .feedbackPanel li.feedbackPanelSUCCESS::before {
                content: "\f00c";
            }

            .feedbackPanel li.feedbackPanelERROR {
                color: var(--error);
                background-color: #fdf2f2;
                border: 1px solid var(--error);
                border-left: 5px solid var(--error);
            }

            .feedbackPanel li.feedbackPanelERROR::before {
                content: "\f071";
            }

            .feedbackPanel li.feedbackPanelINFO {
                color: #856404;
                background-color: #fff3cd;
                border: 1px solid #ffeeba;
                border-left: 5px solid #f39c12;
            }

            .feedbackPanel li.feedbackPanelINFO::before {
                content: "\f05a";
            }

            @media (max-width: 768px) {
                .page {
                    padding: 15px;
                }
                
                .content {
                    padding: 20px;
                }
                
                .selector-perfil {
                    flex-direction: column;
                    align-items: flex-start;
                }
                
                .selector-perfil select {
                    width: 100%;
                }
                
                .selector-perfil span {
                    margin-left: 0;
                }
                
                th, td {
                    padding: 8px 5px;
                    font-size: 13px;
                }
            }
        </style>
    </wicket:head>

    <div class="page">
        <div class="content">
            <h1 class="page-title" wicket:id="titulo">Permisos por Perfil</h1>
            
            <div class="selector-perfil">
                <label>Seleccionar Perfil:</label>
                <select wicket:id="perfilSelector"></select>
                
                <span wicket:id="mensajeSoloLectura"></span>
            </div>

            <form wicket:id="formularioPermisos">
                
                <div wicket:id="feedbackPanel" class="feedbackPanel"></div>

                <div class="tabla-permisos">
                    <table>
                        <thead>
                            <tr>
                                <th>Módulo</th>
                                <th>Agregar</th>
                                <th>Editar</th>
                                <th>Eliminar</th>
                                <th>Consultar</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <wicket:container wicket:id="grupoMenu">
                                <tr class="grupo-menu-tr">
                                    <td colspan="6">
                                        <i class="fas fa-folder-open"></i> <span wicket:id="nombrePadre"></span>
                                    </td>
                                </tr>
                                
                                <tr wicket:id="moduloList" class="modulo-tr">
                                    <td wicket:id="nombreModulo"></td>
                                    <td><input type="checkbox" wicket:id="agregar"></td>
                                    <td><input type="checkbox" wicket:id="editar"></td>
                                    <td><input type="checkbox" wicket:id="eliminar"></td>
                                    <td><input type="checkbox" wicket:id="consultar"></td>
                                    <td>
                                        <a wicket:id="limpiarPermisos" class="icono-limpiar">
                                            <i class="fas fa-trash-alt"></i>
                                        </a>
                                    </td>
                                </tr>
                            </wicket:container>
                        </tbody>
                    </table>
                </div>
                
                <button wicket:id="btnGuardar" class="btn-guardar">Guardar Cambios</button>
            </form>
        </div>
    </div>
</wicket:extend>
